name: Weekly Price-Momentum TW Update

on:
  schedule:
    - cron: "8 1 * * 6"
  workflow_dispatch:
    inputs:
      retry:
        description: >-
          內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-price-momentum-tw:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" requests lxml

      - name: Build Price-Momentum TW (P10-TW) paper track
        run: python scripts/build_price_momentum_tw.py

      - name: Commit and push if changed
        id: commit_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          if git status --porcelain docs/research/price-momentum-tw/track.json | grep -q .; then
            echo "Changes detected"
          else
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/research/price-momentum-tw/track.json
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "data: weekly P10-TW update ${DATE}"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            bash scripts/ci/rebase_or_flag.sh || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh
