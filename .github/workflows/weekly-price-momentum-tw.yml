name: Weekly Price-Momentum TW Update

on:
  schedule:
    - cron: "8 1 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-price-momentum-tw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" requests lxml

      - name: Build Price-Momentum TW (P10-TW) paper track
        run: python scripts/build_price_momentum_tw.py

      - name: Commit and push if changed
        run: |
          if git status --porcelain docs/research/price-momentum-tw/track.json | grep -q .; then
            echo "Changes detected"
          else
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/research/price-momentum-tw/track.json
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "data: weekly P10-TW update ${DATE}"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            git pull --rebase --autostash origin main || { echo "Rebase failed"; exit 1; }
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1
