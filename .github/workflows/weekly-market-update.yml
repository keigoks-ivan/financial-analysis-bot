name: Weekly Market Data Update

on:
  schedule:
    - cron: "8 0 * * 6"
  workflow_dispatch:
    inputs:
      retry:
        description: >-
          內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" requests lxml

      - name: Run market data updater
        id: updater
        run: python scripts/update_markets.py

      - name: Build risk on/off gauge
        run: python scripts/build_risk_gauge.py

      - name: Build Momentum-5 screen data
        run: python scripts/build_momentum5.py

      - name: Build Momentum-5 shadow track (non-fatal)
        run: python scripts/build_momentum5_shadow.py || echo "shadow build failed (non-fatal)"

      - name: Build Momentum-5 Short (PEAD) track (non-fatal)
        run: python scripts/build_momentum5_short.py || echo "short build failed (non-fatal)"

      - name: Build Momentum-5 Fast track (non-fatal)
        run: python scripts/build_momentum5_fast.py || echo "fast build failed (non-fatal)"

      - name: Build Price-Momentum (P10) paper track
        run: python scripts/build_price_momentum.py

      - name: Build Trend-Track (TSMOM) paper track
        run: python scripts/build_trend_track.py

      - name: Build market exposure paper track
        run: python scripts/build_exposure_track.py

      - name: Build Kelly-tilt paper track
        run: python scripts/build_kelly_track.py || echo "build_kelly_track failed — continuing"

      # 2026-09-17 持有人拍板「精選榜改版」移除本週更兩步（見
      # knowledge/rule_ledger.md「精選榜改版：爆發組退役、十倍組改 v5 小市值池」列）：
      # build_picks.py 兩組皆已退役，改為 frozen 輸出，只靠 scripts/update_dd_index.py
      # 的 DD/DCA 同步鏈呼叫即可保持 candidates.json 新鮮，週更再跑一次不會多產生
      # 任何內容；build_tenbagger.py 改為每日隨 GRP 席位一起刷新（見
      # daily-taipei-morning.yml Step 2b），週更沒有存在理由。

      - name: Build macro investment clock (mechanical layer)
        run: python scripts/build_macro_clock.py

      - name: Commit and push if changed
        id: commit_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          if git status --porcelain docs/markets.html docs/sectors.html docs/cache/risk_gauge.json docs/cache/risk_history.json docs/research/momentum-5/data.json docs/research/momentum-5/raw_factors.json docs/research/momentum-5/shadow.json docs/research/momentum-5/portfolio.json docs/research/momentum-5-short/short.json docs/research/momentum-5-fast/fast.json docs/research/price-momentum/track.json data/trend_track_prices.json docs/research/trend-track/track.json docs/market/data/exposure_track.json docs/market/data/kelly_track.json docs/macro/data/clock.json | grep -q .; then
            echo "Changes detected"
          else
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/markets.html docs/sectors.html docs/cache/risk_gauge.json docs/cache/risk_history.json docs/research/momentum-5/data.json docs/research/momentum-5/raw_factors.json docs/research/momentum-5/shadow.json docs/research/momentum-5/portfolio.json docs/research/momentum-5-short/short.json docs/research/momentum-5-fast/fast.json docs/research/price-momentum/track.json data/trend_track_prices.json docs/research/trend-track/track.json docs/market/data/exposure_track.json docs/market/data/kelly_track.json docs/macro/data/clock.json
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "data: weekly market update ${DATE}"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            bash scripts/ci/rebase_or_flag.sh || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh
