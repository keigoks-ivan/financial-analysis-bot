name: Deploy Pages

# 2026-07-05 從 legacy「分支部署」遷移至 Actions 部署管線。
# 動機：legacy 管線單日六次 "Deployment failed, try again later"（syncing_files
# 階段的服務端瞬時錯誤）＋一次漏觸發。Actions 管線更穩定，且 concurrency 讓
# 連續快速 push 自動收斂到最新版（舊部署取消，不再互相踩踏）。
# 自訂網域設定在 Pages settings，不受此遷移影響；docs/CNAME 保留無害。

# Deploy triggers — four layers so the live site can never silently lag behind
# committed docs/ (see 2026-07-14 monitor incident):
#   1. push docs/**        — external-repo crons push via PAT → instant deploy.
#   2. workflow_run        — same-repo crons that commit via github-actions[bot];
#                            a GITHUB_TOKEN push does NOT retrigger `push`
#                            workflows (GitHub anti-recursion), so those bot
#                            commits would otherwise never deploy on their own.
#                            workflow_run is exempt from that restriction and
#                            fires the moment the cron completes (~07:35 Taipei
#                            for the 23:30 UTC monitor). Weekly Decision Engine
#                            added 2026-07-20: its docs/engine/ refresh sat
#                            un-deployed for 4.5h waiting on layer 3, and an
#                            Actions runner outage that night swallowed the
#                            scheduled sweep entirely — the site served
#                            week-old engine data for ~7h. Layer 3 alone is not
#                            enough for weekly crons whose output the cockpit
#                            reads directly. W52 adaptive vol-target added
#                            2026-07-21: it commits docs/long-track-w52-adaptive/
#                            TWICE per trading day (TW + US close) and drives the
#                            LIVE sleeve's email alerts, so an up-to-6h deploy lag
#                            meant the live-system page (target exposures the user
#                            acts on) trailed its own committed data every day.
#                            Daily US Close Band + Daily Market Detective added
#                            2026-07-21: the 2026-07-18 consolidation folded
#                            monitor-daily / rotation-radar-daily into "Daily US
#                            Close Band" (dispatch-only now), so the two entries
#                            below inherited from them stopped firing on schedule
#                            — monitor / rotation / detective data deployed only
#                            via layer 3's 6h sweep. "Daily US Close Band" (the
#                            real nightly refresh of monitor+rotation) and "Daily
#                            Market Detective" (its own alert-network commit) are
#                            now listed directly. The two dormant entries are kept
#                            so a manual dispatch of either still deploys.
#   3. schedule            — name-independent safety net every 6h: catches ANY
#                            other bot-committed docs/ change (screeners /
#                            fundamentals / weekly crons) without having to
#                            enumerate every workflow here. Future crons are
#                            covered automatically, but with up to 6h of lag.
#   4. workflow_dispatch   — manual redeploy.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_run:
    workflows:
      # 2026-09-13：市場資料與週度跨資產產物落帳後立即部署，避免等待六小時補漏。
      - "Market State Daily"
      - "Weekly Cross-Asset Refresh (crowding + rotation + regime)"
      - "Intel 2.0 Daily Chain"                        # 情報監視器一條鏈（06:30 TPE；GITHUB_TOKEN push 不觸發 push 事件，靠這行即時部署）
      - "Daily US Close Band"                          # 主要夜間刷新（monitor＋rotation＋home pulse，2026-07-18 併入）
      - "Daily Market Detective"                       # detective 警報網自身 commit
      - "Weekly Decision Engine"
      - "Update W52 × Adaptive Vol-Target Signal (US+TW)"
      - "Daily Market Monitor"                         # dispatch-only：手動刷新時仍部署
      - "Daily Asset Rotation Radar (RRG)"             # dispatch-only：手動刷新時仍部署
      - "Stock Dashboard Daily Data"                   # 2026-09-22：個股儀表板每日資料（不進 git，靠 artifact），跑完即重部署
      - "ETF Dashboard Daily Data"                     # 2026-09-24：ETF 儀表板每日資料（進 git，用 GITHUB_TOKEN push 不觸發 push 事件，靠這行即時部署）
      - "Active ETF Daily Data"                        # 2026-09-25：主動式 ETF 每日持股/AUM/分析（進 git，靠這行即時部署）
      - "US Close Stale Recheck"                       # 2026-09-24：Daily US Close Band 隔天過期重查補跑（同樣 GITHUB_TOKEN push 不觸發 push 事件）
    types: [completed]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # gh run list / gh run download（下載 Stock Dashboard Daily Data 最新 artifact，見下方 fail-safe 步驟）

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Always deploy the latest main HEAD. Under workflow_run the default
          # checkout ref is the triggering run's START sha (i.e. BEFORE the cron's
          # data commit), which would deploy stale docs — pin main explicitly.
          ref: main

      # 2026-09-22：個股儀表板逐檔資料（docs/stock-dash/data/，~61MB）刻意不進 git
      # （見 .gitignore），改由 stock-dash-daily.yml 每日建置後上傳成 artifact，
      # 這裡在組 Pages artifact 前下載進 docs/stock-dash/data/。
      # 2026-09-25 改：原本「下載失敗也照部署」——09-24 一次 GitHub API 503 讓部署
      # 不帶資料上線，全站儀表板 404。現在查詢與下載各重試 3 次；仍失敗就讓這次
      # 部署失敗（Pages 保留上一版，資料不會消失），等下一次部署。只有「確定沒有
      # 未過期 artifact」（查詢成功但回空）才照舊不帶資料部署。
      - name: Download latest stock-dash data (retry; fail deploy rather than ship without it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p docs/stock-dash/data
          # 取最新一份未過期的 stock-dash-data artifact（gate 跳過的 run 沒有 artifact，不能只看 success）
          for i in 1 2 3; do
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=stock-dash-data&per_page=1" \
              -q '.artifacts[0] | select(.expired == false) | .workflow_run.id')
            API_RC=$?
            [ $API_RC -eq 0 ] && break
            echo "::warning::artifact lookup failed (attempt $i/3), retrying..."
            sleep $((i * 20))
          done
          if [ $API_RC -ne 0 ]; then
            echo "::error::Could not query stock-dash-data artifacts — failing this deploy so the live site keeps its data."
            exit 1
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::warning::No unexpired stock-dash-data artifact — deploying without stock-dash data."
            exit 0
          fi
          for i in 1 2 3; do
            rm -rf docs/stock-dash/data && mkdir -p docs/stock-dash/data
            if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n stock-dash-data -D docs/stock-dash/data; then
              echo "Downloaded stock-dash data from run $RUN_ID"
              exit 0
            fi
            echo "::warning::download of run $RUN_ID failed (attempt $i/3), retrying..."
            sleep $((i * 20))
          done
          echo "::error::Failed to download stock-dash-data (run $RUN_ID) after 3 attempts — failing this deploy so the live site keeps its data."
          exit 1

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
