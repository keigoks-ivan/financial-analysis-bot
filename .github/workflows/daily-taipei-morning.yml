name: Daily Taipei Morning Band

# ─────────────────────────────────────────────────────────────────────────
# 時段帶 B — 台北早晨帶（2026-07-18 整合建立）
#
# 目的：把台北早晨（美股 settle 完、台股開盤前）跑的每日刷新收斂成單一 job，
# 減少 01:00 UTC 附近的同時起跑與 concurrent-push 競態。
#
# 排程：Tue-Sat 01:00 UTC ＝ 台北 09:00。
#
# 整合對照表（舊 workflow → 本帶 steps）：
#   daily-non-fundamental-refresh.yml → build_dd_screener.py（build_quality_entry.py 於 2026-10-19 歸檔停跑）
#                                       / state_machine/study/write_daily_close.py
#                                       / sop_funnel/build.py + alert.py（含 SOP email）
#
# detective-daily.yml 的處理決定：維持獨立、不併入本帶。理由——detective 帶有
# workflow_run 事件驅動觸發（monitor / rotation radar 跑完就重生）＋兩個 cron 班次
# ＋三級 email tier 邏輯與 github.event.schedule 深度耦合，併入風險高。改為把它的
# 平日 cron 從 01:00 錯開到 01:30 UTC（見 detective-daily.yml 檔頭）。
#
# 全站每日排程總表（整合後）：
#   07:00 / 21:35 UTC  update_long_track_w52_adaptive（實盤主系統，未整合）
#   21:45 UTC          帶 A · Daily US Close Band
#   23:00 UTC          daily_analysis（旗艦每日分析，未整合）
#   01:00 UTC          帶 B · Daily Taipei Morning Band（本檔）
#   01:30 UTC          detective-daily（獨立，錯峰後）
#   08:00 / 11:00 UTC  帶 C · Daily Asia Close Band
#
# 被整合的舊 workflow 保留 workflow_dispatch，可隨時手動觸發（排程已停用）。
# ─────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 1 * * 2-6"  # Tue-Sat 01:00 UTC = Tue-Sat 09:00 Taipei
  workflow_dispatch:
    inputs:
      retry:
        description: >-
          內部用：由本 workflow 自己在 rebase 衝突後重觸發時帶 1，
          防止無限重觸發迴圈。手動觸發請留 0。
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write  # 讓 GITHUB_TOKEN 能在 rebase 衝突時 `gh workflow run` 重觸發自己一次

concurrency:
  group: daily-taipei-morning
  cancel-in-progress: false

jobs:
  taipei-morning-band:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (union of merged workflows)
        run: pip install "yfinance>=0.2.40" pandas numpy lxml

      # ── daily-non-fundamental-refresh ──
      - name: "[non-fundamental] Step 1 — DD Screener latest.json (MA + timing refresh)"
        # 2026-09-09（選股系統 v3 席位資格）：--include-non-dd 讓 QGM 品質池名字
        # 進 dd-screener universe，跟 DD 名字一樣拿 Koyfin FY1→FY3 EPS + 品質 +
        # 時機——這是 v3「席位不再要求先有 DD」的資料面前提（見 CLAUDE.md 選股
        # 體系治理 §5、knowledge/rule_ledger.md v3 席位資格列）。
        run: python scripts/build_dd_screener.py --include-non-dd
        continue-on-error: true

      # 席位擂台每日全量重跑（v5 席位引擎，2026-09-17 持有人拍板，取代 v4 的窄流程
      # --lamp-only，見 scripts/engine/build_arena.py 檔頭 --daily 段／
      # knowledge/rule_ledger.md「v5 席位引擎」列）：全量重算資格/池/排序/時機燈/
      # 距歷史新高，讀剛更新的 dd-screener latest.json（timing.*/ma.*，含
      # dist_ath_pct）；不寫 arena-ledger.json（那個只有 weekly-engine.yml 的
      # --ledger 跑次會寫），核心席名單仍取自帳本 roster.core（v5.2 起每週六 --ledger
      # 跑次依週五收盤亮燈重選；日跑只刷燈號與倉位，週中轉紅只標註、不下席）。
      # 失敗只 warning，不擋本帶其餘 step。
      - name: "[non-fundamental] Step 2 — Arena daily refresh (pool/timing lamp, core seats from ledger)"
        run: python scripts/engine/build_arena.py --daily || echo "::warning::daily arena refresh failed"
        continue-on-error: true

      # v5 smallcap 池第二 Koyfin 母體（2026-09-17，見 notes/site-internal/root/
      # _koyfin_smallcap_watchlist_20260917.md）：dd_smallcap watchlist 自己的
      # xlsx family（DD_smallcap_EPS_estimates_*），寫 docs/dd-screener/smallcap/
      # latest.json，跟主 dd-screener latest.json 隔離。Koyfin 重新抓取仍是手動
      # （見該 skill），本步只重跑機械 enrich（ROIC 分解／體質閘／距歷史新高／
      # 動能／財報日曆／融券），失敗只 warning 不擋本帶其餘 step。
      - name: "[non-fundamental] Step 2a — DD Screener smallcap pool latest.json"
        run: python scripts/build_dd_screener.py --universe smallcap || echo "::warning::smallcap dd-screener build failed"
        continue-on-error: true

      # TW 池第四個 Koyfin 母體（2026-10-09，見 notes/site-internal/root/
      # _koyfin_tw_watchlist_20261009.md）：dd_tw watchlist 自己的 xlsx family
      # （DD_tw_EPS_estimates_*），寫 docs/dd-screener/tw/latest.json，跟主檔、
      # smallcap 都隔離，不進 tenbagger／arena。時機排名對台股 screener
      # （docs/screener/tw_latest.json），不對美股。失敗只 warning。
      - name: "[non-fundamental] Step 2a-tw — DD Screener TW pool latest.json"
        run: python scripts/build_dd_screener.py --universe tw || echo "::warning::tw dd-screener build failed"
        timeout-minutes: 20
        continue-on-error: true

      # 台股池頁 docs/dd-screener/tw/index.html 由主頁衍生（只換標題、hero、加說明框），
      # 說明框的檔數／DD 數取自上一步剛寫的 tw/latest.json，所以緊接在後重生。
      # 主頁錨點移動時腳本 exit 1、舊頁保留，只 warning。
      - name: "[non-fundamental] Step 2a-tw-page — DD Screener TW pool page"
        run: python scripts/build_dd_screener_tw_page.py || echo "::warning::tw dd-screener page build failed"
        continue-on-error: true

      # 台股核心席（2026-10-10，見 knowledge/rule_ledger.md「台股核心席」列）：讀 Step 2a-tw
      # 剛寫的 tw/latest.json，跑美股核心席同一套規則（import scripts/engine，不改它）。
      # 週六（台北）這班依週五收盤重選席位並記帳（--ledger），其餘日子只更新時機燈。
      # 寫 docs/cockpit-tw/data/，失敗只 warning。
      - name: "[non-fundamental] Step 2a-tw-seats — TW core seats"
        run: |
          ARGS=""
          [ "$(TZ=Asia/Taipei date +%u)" = 6 ] && ARGS="--ledger"
          python scripts/build_seats_tw.py $ARGS || echo "::warning::tw seats build failed"
        continue-on-error: true

      # 台股全市場雷達（2026-10-10，見 knowledge/rule_ledger.md「台股全市場雷達」列）：美股雷達的
      # 四種形狀跑台股階段雷達母體（0050／0051／006201 成分股＋台股池），只在週六（台北）這班
      # 依週五收盤掃一次。自己下載週線，不寫 data/weekly_cache*；可算的名字不到七成就不寫檔。
      - name: "[non-fundamental] Step 2a-tw-radar — TW radar (Saturday)"
        run: |
          if [ "$(TZ=Asia/Taipei date +%u)" = 6 ]; then
            python scripts/build_radar_tw.py || echo "::warning::tw radar build failed"
          else
            echo "not Saturday (Taipei) — radar-tw skipped"
          fi
        continue-on-error: true

      # 精選榜「十倍」組 v5 小市值池（2026-09-17 持有人拍板「精選榜改版」，見
      # knowledge/rule_ledger.md「精選榜改版：爆發組退役、十倍組改 v5 小市值池」列）：
      # 與上面 Arena daily refresh 讀同一份剛更新的 dd-screener latest.json，跑同一套
      # GRP 席位 v5 資格閘規則（scripts/engine/grp.py），只換市值帶（$10億–$200億，
      # GRP 席位地板之下）——排在 Arena 之後、Quality-Entry 之前，失敗只 warning，
      # 不擋本帶其餘 step。母體 2026-09-17 起併入上一步的 smallcap latest.json
      # （見 build_tenbagger.py load_universe()）。
      # v5.7（2026-10-21）：十倍組設 10 席。週六（台北）這班依週五收盤重選席位並記帳（--ledger），
      # 其餘日子只刷新燈號與池（席位沿用 docs/picks/tenbagger_seats.json）；狀態檔不存在時第一次跑直接補。
      - name: "[non-fundamental] Step 2b — Picks tenbagger v5 small-cap pool daily refresh"
        run: |
          ARGS=""
          [ "$(TZ=Asia/Taipei date +%u)" = 6 ] && ARGS="--ledger"
          python scripts/build_tenbagger.py $ARGS || echo "::warning::tenbagger v5 small-cap pool refresh failed"
        continue-on-error: true

      # ── 選股席位變化通知（2026-10-22）：只報三套席位（美股看板 5、台股 5、十倍組 10）的進出席，
      #    以及各套「排隊前 5 名」的成員進出。取代原本在 daily-us-close.yml 的「選股主控台名單變化」。
      #    放在席位與排隊都算完之後；狀態檔 docs/engine/roster_notify_state.json 換版後第一次只建基準。
      #    週六美股看板換席在 weekly-engine.yml 11:00 台北之後，那邊也跑同一支腳本。──
      - name: "[roster] Check seat roster changes"
        continue-on-error: true
        run: python scripts/check_seat_roster_alerts.py

      - name: "[roster] Read seat roster alert"
        id: roster_alert
        continue-on-error: true
        run: |
          if [ -f roster_alert.txt ] && [ -f roster_alert_subject.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "subject<<ROSTER_EOF"
              cat roster_alert_subject.txt
              echo "ROSTER_EOF"
              echo "body<<ROSTER_EOF"
              cat roster_alert.txt
              echo "ROSTER_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "[roster] Email seat roster changes"
        if: steps.roster_alert.outputs.changed == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: ${{ steps.roster_alert.outputs.subject }}
          to: keigoks@gmail.com
          from: InvestMQuest Signals <${{ secrets.MAIL_USERNAME }}>
          html_body: file://roster_alert_mail.html
          body: ${{ steps.roster_alert.outputs.body }}

      - name: "[roster] Discord notify seat roster changes"
        if: steps.roster_alert.outputs.changed == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PICKS }}
          NOTIFY_TITLE: ${{ steps.roster_alert.outputs.subject }}
          NOTIFY_BODY: ${{ steps.roster_alert.outputs.body }}
        run: python3 scripts/notify_discord.py --title-env NOTIFY_TITLE --body-env NOTIFY_BODY --url https://research.investmquest.com/cockpit/

      # Step 3（Quality-Entry screener）2026-10-19 持有人拍板歸檔：頁面停止更新、每日快照搬出網站，
      # 本帶不再跑 scripts/build_quality_entry.py（腳本留著可手動重產；dd2/run.py 仍 import 其中的函式）。

      - name: "[non-fundamental] Step 8 — Study daily closes slice (態④研究寬表 forward 切片)"
        run: python scripts/state_machine/study/write_daily_close.py
        continue-on-error: true

      - name: "[non-fundamental] Step 9 — Pure MA SOP 漏斗（訊號掃描 + 帳本 + 記分板頁）"
        run: python scripts/sop_funnel/build.py
        continue-on-error: true

      - name: "[non-fundamental] Step 9b — SOP 漏斗板機 alert 檔"
        run: python scripts/sop_funnel/alert.py
        continue-on-error: true

      - name: "[non-fundamental] Read SOP funnel alert"
        id: sop_alert
        continue-on-error: true
        run: |
          if [ -f sop_funnel_alert.txt ]; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<ALERT_EOF"
              cat sop_funnel_alert.txt
              echo "ALERT_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "[non-fundamental] Email SOP funnel trigger"
        if: steps.sop_alert.outputs.triggered == 'true'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "🎯 SOP 漏斗板機 — 今日有通過全部 veto 的進場訊號"
          to: keigoks@gmail.com
          from: InvestMQuest Signals <${{ secrets.MAIL_USERNAME }}>
          html_body: file://sop_funnel_mail.html
          body: |
            ${{ steps.sop_alert.outputs.body }}

            —
            InvestMQuest · 每日收盤後自動掃描

      - name: Discord notify (SOP funnel)
        if: steps.sop_alert.outputs.triggered == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TRADE }}
          NOTIFY_TITLE: "🎯 SOP 漏斗板機 — 今日有通過全部 veto 的進場訊號"
          NOTIFY_BODY: ${{ steps.sop_alert.outputs.body }}
        run: python3 scripts/notify_discord.py --title-env NOTIFY_TITLE --body-env NOTIFY_BODY --url https://research.investmquest.com/dd-screener/sop-funnel.html

      # ── 收斂：單一 commit + push（路徑＝原 workflow commit 路徑）──
      - name: Commit and push if changed
        id: commit_and_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          PATHS=""
          for p in \
            data/weekly_cache/ \
            docs/dd-screener/latest.json \
            docs/dd-screener/smallcap/ \
            docs/dd-screener/tw/ \
            docs/cockpit-tw/data/ \
            docs/dd-screener/state-machine/data/study/closes_daily/ \
            docs/dd-screener/sop-funnel.html \
            docs/dd-screener/sop-funnel/ \
            docs/engine/arena.json \
            docs/engine/arena_state.json \
            docs/engine/_board_body.html \
            docs/engine/board.txt \
            docs/engine/_arena_body.html \
            docs/engine/universe_board.json \
            docs/engine/roster_notify_state.json \
            docs/picks/tenbagger.json \
            docs/picks/tenbagger_seats.json; do
            [ -e "$p" ] && PATHS="$PATHS $p"
          done
          if [ -z "$PATHS" ]; then
            echo "No output paths present; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          DATE=$(TZ=Asia/Taipei date +"%Y-%m-%d")
          git commit -m "data: Taipei morning band update ${DATE}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            bash scripts/ci/rebase_or_flag.sh || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1

      # 只有「非 retry run 撞到 rebase 衝突」才自我重觸發一次；上面的 IS_RETRY=1
      # 分支已經把 conflict=true 但用 ::error:: 結尾，這裡的 retry 條件會把它
      # 排除掉，不會第二次重觸發。這一步本身失敗（例如 gh 觸發失敗）會讓本次
      # run 整體標記失敗，不會安靜吞掉「連重觸發都失敗」的情況。
      - name: Self-retrigger a fresh run after rebase conflict (loop-guarded by retry=1)
        # failure()：上一步 exit 1 後，沒有狀態函式的 if 會被預設的 success() 擋掉，必須明寫
        if: failure() && steps.commit_and_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh
