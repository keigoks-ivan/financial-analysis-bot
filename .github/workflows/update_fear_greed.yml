name: "Update Fear/Greed Thermometer (weekly reminder)"

# 2026-11-24 持有人拍板：這條不再自己發 Discord（#調倉）與 Email。狀態改變時 update_fear_greed.py 在
# data/live_digest/fear_greed.json 追加一則摘要，推上去後派 trade-digest.yml，併進 #調倉 美股那則的「市場溫度」一段
# （只出現一次，Email 附各材料百分位）。原本的「寄測試信」選項一起拿掉；要看訊息長相用 trade-digest.yml 的 dry_run。

on:
  schedule:
    # 每週六 08:00 台北（= 週六 00:00 UTC）跑一次：美股週五收盤後、台股週五收盤後。
    # 溫度計是提醒，不是交易規則；只在狀態改變時寄 email 與 Discord。
    - cron: '0 0 * * 6'
  workflow_dispatch:  # 手動觸發
    inputs:
      no_notify:
        description: '只更新資料與頁面，不寫通知檔（不進 #調倉）'
        type: boolean
        default: false
      retry:
        description: >-
          內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'  # site_nav.py uses 3.12+ f-string syntax

      - name: Install dependencies
        # openpyxl：FINRA margin-statistics.xlsx；xlrd：Shiller ie_data.xls
        run: pip install pandas numpy openpyxl xlrd

      - name: Update fear/greed thermometer
        # 抓最新材料（任一項失敗都沿用上期資料並在 latest.json 標 stale）→ 追加本週一列到
        # history_us.csv／history_tw.csv → 重寫 latest.json 與 /fear-greed/ 頁。狀態改變時
        # 才在 data/live_digest/fear_greed.json 追加 #調倉 用的摘要（另寫 fg_alert.txt 等，不再寄出）。
        id: fg
        env:
          NO_NOTIFY: ${{ inputs.no_notify }}
        run: |
          ARGS=""
          if [ "$NO_NOTIFY" = "true" ]; then ARGS="--no-notify"; fi
          python scripts/update_fear_greed.py $ARGS
          if [ -f fg_alert.txt ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Commit and push
        id: commit_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add docs/fear-greed/index.html docs/fear-greed/data
          if [ -f data/live_digest/fear_greed.json ]; then git add data/live_digest/fear_greed.json; fi
          git diff --staged --quiet || git commit -m "Auto update fear/greed thermometer: $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            bash scripts/ci/rebase_or_flag.sh || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1

      - name: Dispatch trade digest
        # 狀態改變那次才派：讓 #調倉 美股那則（還沒發的話）把市場溫度一段帶進去；已經發過就留到下一則美股訊息
        if: steps.fg.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run trade-digest.yml --ref main -f market=us -f retry=0

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh
