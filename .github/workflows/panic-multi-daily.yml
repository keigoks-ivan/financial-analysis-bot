name: Panic Multi Daily

# 「多類同時」恐慌訊號（/backtest/viable/panic_multi/）每日更新，2026-11-24 上線。
# 規則照 v7-backtest docs/Panic_Call_Prereg.md 第 41～77 行與修改紀錄（2026-11-24 起部位結束就重新待命）；程式 scripts/panic_multi/。
# 每次跑：美股 yfinance 接最近兩個月、台股證交所加權指數＋期交所台指選擇權（自算台指 VIX）＋
# Release revmom-data 的上市櫃日線（鎖跌停家數比率）→ 補進場規格表 → 三個市場全史重播 → 寫 data/panic_multi/、頁面
# 與首頁燈號 docs/backtest/viable/panic_multi/lamp.json（首頁 docs/index.html 載入時讀它）。
# 2026-11-24 起這條線不自己寄 Email、發 Discord：推送成功後派 trade-digest.yml（#調倉 每個市場每天一則），
# 由它讀 data/panic_multi/state.json，「今天亮、明天要進場」放進「要做的事」，平常只佔「少見事件」一行；
# 該市場那天的訊息已經發過時補發一則「補充」。update.py 照舊寫 notified.json 與通知檔，只是 workflow 不再送出。
#
# 排程（三個入口，任一輪都同時更新美股與台股；concurrency 讓它們排隊不重疊）：
#   - 22:40 UTC 週一至週五：美股收盤後（冬令 17:40 ET、夏令 18:40 ET；程式丟掉 17:30 ET 前的當日 K 棒），
#     趕在 UTC 午夜前（Yahoo 午夜後最新一根常是 NaN）。
#   - 04:17 UTC 週二至週六：補跑，前一輪延誤或抓不到時接上。
#   - RevMom Daily 跑完：台股上市櫃日線進 Release 後立刻算台股（RevMom 常延到台北清晨才跑完）。

on:
  schedule:
    - cron: "40 22 * * 1-5"
    - cron: "17 4 * * 2-6"
  workflow_run:
    workflows: ["RevMom Daily"]
    types: [completed]
  workflow_dispatch:
    inputs:
      retry:
        description: 內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # site_nav.py 用 3.12 的 f-string 語法

      - name: Install dependencies
        run: pip install "pandas==2.3.3" "numpy<2.5" pyarrow yfinance

      - name: Download listed-stock daily data (Release revmom-data)
        id: revmom
        continue-on-error: true
        run: |
          mkdir -p /tmp/rv
          for i in 1 2 3; do
            gh release download revmom-data -p revmom-data.tar.gz -D /tmp --clobber && break
            echo "::warning::release download failed (attempt $i/3)"; sleep $((i * 20))
          done
          test -s /tmp/revmom-data.tar.gz
          tar xzf /tmp/revmom-data.tar.gz -C /tmp/rv
          python -c "import json; m=json.load(open('/tmp/rv/data/revmom/meta.json')); print('revmom data to', m['last_date'])"

      - name: Update signal
        env:
          REVMOM_OK: ${{ steps.revmom.outcome }}
        run: |
          ARGS=""
          if [ "$REVMOM_OK" = "success" ]; then ARGS="--revmom /tmp/rv/data/revmom"; fi
          python scripts/panic_multi/update.py $ARGS

      - name: Commit and push
        id: commit_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/panic_multi docs/backtest/viable/panic_multi
          git diff --staged --quiet || git commit -m "Auto update panic multi signal: $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            bash scripts/ci/rebase_or_flag.sh || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1

      - name: Deploy site
        continue-on-error: true
        run: gh workflow run deploy-pages.yml --ref main

      - name: Dispatch trade digest
        # 恐慌狀態推上去之後讓 #調倉 每日一則重新判斷（美股等恐慌燈到齊才發；台股恐慌燈晚到且亮了會補發）。
        continue-on-error: true
        run: gh workflow run trade-digest.yml --ref main -f market=all -f retry=0

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        run: bash scripts/ci/retrigger_once.sh
