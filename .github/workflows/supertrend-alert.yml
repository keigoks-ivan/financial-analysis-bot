name: "Supertrend weekly/monthly alert"

# Supertrend 週線／月線翻轉提醒（SMH 倫敦、SMH 美國、QQQ 用 ATR 14／倍數 3；0050、2330 用 ATR 14／倍數 2；債金疊加的 IEF、GLD 用 14／3，2026-11-04 加入、首次只記錄），持有人 2026-11-03 要求。
# 2026-11-04 起參數與實單規則同一份（scripts/supertrend_core.py），改參數後第一次執行只重建狀態檔、不補寄。
# 實單規則自 2026-11-04 收盤的訊號起用同一套 Supertrend；這裡仍是單獨的翻轉提醒（含週五預警）；只在翻轉（或週五預警）時寄 email 與 Discord。程式 scripts/supertrend_alert.py。
# 2026-11-10 持有人拍板：排程停用，翻轉說明、週五預警、SMH 倫敦版翻轉都併進實單 workflow
# （update_long_track_w52_adaptive.yml：scripts/live_notify.py＋build_live_mail.py，共用 data/live_notify/state.json）。
# 只拿掉排程、保留手動觸發與失敗通知：檔案與狀態檔留著，第一次併入時 live_notify.py 從這裡的狀態檔接 SMH 倫敦版的上次記錄。
# 不要再手動跑 confirm／warn：這裡的狀態檔從 11-10 起不再更新，手動跑會把之後已由實單信寄過的翻轉再寄一次。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'confirm＝只看已收完的 K 棒；warn＝另加還沒收完的預警'
        type: choice
        options: [confirm, warn]
        default: confirm
      test_notify:
        description: '寄一則標題含「測試」的測試信（email＋Discord），不改狀態檔'
        type: boolean
        default: false
      no_notify:
        description: '只更新狀態檔，不寄 email／Discord'
        type: boolean
        default: false
      retry:
        description: >-
          內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy yfinance

      - name: Check Supertrend signals
        env:
          SCHED: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
          NO_NOTIFY: ${{ inputs.no_notify }}
        run: |
          MODE="confirm"
          if [ "$SCHED" = "40 6 * * 5" ]; then MODE="warn"; fi
          if [ -n "$IN_MODE" ]; then MODE="$IN_MODE"; fi
          ARGS="--mode $MODE"
          if [ "$TEST_NOTIFY" = "true" ]; then ARGS="$ARGS --test-alert"; fi
          if [ "$NO_NOTIFY" = "true" ]; then ARGS="$ARGS --no-notify"; fi
          python scripts/supertrend_alert.py $ARGS

      - name: Read alert
        id: stalert
        run: |
          if [ -f st_alert.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "title=$(head -n 1 st_title.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # MAIL_USERNAME／MAIL_APP_PASSWORD 與其他提醒共用；缺少時略過寄信，不讓 workflow 失敗。
      - name: Check mail secrets
        id: mailcfg
        env:
          MU: ${{ secrets.MAIL_USERNAME }}
          MP: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          if [ -n "$MU" ] && [ -n "$MP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false (SMTP secrets missing — email skipped)" >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email alert
        if: steps.stalert.outputs.changed == 'true' && steps.mailcfg.outputs.ready == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: ${{ steps.stalert.outputs.title }}
          to: keigoks@gmail.com
          from: InvestMQuest Signals <${{ secrets.MAIL_USERNAME }}>
          html_body: file://st_mail.html

      - name: Discord notify
        if: steps.stalert.outputs.changed == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TRADE }}
          NOTIFY_TITLE: ${{ steps.stalert.outputs.title }}
        run: python3 scripts/notify_discord.py --title-env NOTIFY_TITLE --body-file st_alert.txt --url https://research.investmquest.com/backtest/supertrend_vs_live/

      - name: Commit and push
        id: commit_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/supertrend_alert/state.json
          git diff --staged --quiet && exit 0
          git commit -m "Auto update supertrend alert state: $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            bash scripts/ci/rebase_or_flag.sh || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh

      - name: Discord notify on failure
        if: failure() && !(steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1')
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TRADE }}
          NOTIFY_TITLE: "排程失敗：supertrend-alert"
          NOTIFY_BODY: "supertrend-alert 執行失敗：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python3 scripts/notify_discord.py --title-env NOTIFY_TITLE --body-env NOTIFY_BODY --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
