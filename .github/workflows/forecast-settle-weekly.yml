name: Weekly Forecast Ledger Settle + Flowmap Scorecard

# 自動對帳與進化迴路（設計稿 §F：notes/site-internal/root/
# _flowmap_forecast_ledger_design_20260901.md）。零 LLM、純機械，每週跑一次：
#
#   1. knowledge/settle_forecasts.py            — 結算 forecasts.jsonl 的 open
#      筆（price:/monitor:/rv:/pxd:/vixts: 五域，detective: 未實作），回寫
#      status/outcome/brier。
#   2. scripts/generate_rv_forecasts.py --write  — RV 預測 producer（每月首個
#      交易日才真的落帳，同月同 source 查重內建；週跑月落帳，其餘週次會被
#      拒絕，拒絕不是失敗，見下方 step 的 `|| echo` 容錯）。
#   3. scripts/build_rv_base_rates.py --if-due   — 季度自動重建轉移表
#      （built_at 距今 <85 天則自己跳過，not due 不是失敗）。
#   4. scripts/generate_vix_forecasts.py --write — vix-model 事件觸發 producer
#      （VIX 期限結構倒掛 onset；無事件時 exit 0 不落帳，不是失敗，見設計稿
#      §G5）。
#   5. scripts/generate_cot_forecasts.py --write — cot-model 事件觸發 producer
#      （權益三指數 COT net_pct_oi 極端分位；無事件時 exit 0 不落帳，同上）。
#   6. scripts/build_vixts_base_rates.py --if-due — 季度自動重建 VIX 倒掛
#      base rate（同 rv 的 --if-due 慣例）。
#   7. scripts/build_cot_base_rates.py --if-due   — 季度自動重建 COT 極端部位
#      base rate（同上）。
#   8. scripts/generate_tsmom_forecasts.py --write — tsmom producer（趨勢方向
#      模型；每月首個交易日才落帳，同月同 ticker 查重內建，見設計稿
#      notes/site-internal/root/_forecast_v2_design_20260902.md §5.2）。
#   9. scripts/generate_vrp_forecasts.py --write  — vrp producer（波動風險
#      溢酬模型；每月首個交易日落帳兩筆 21d／63d，同月查重內建，§5.3）。
#  10. scripts/generate_dd_verdict_forecasts.py --write — dd-verdict producer
#      （個股裁決跑贏 SPY；掃 knowledge/decisions.jsonl 未落帳者，事件觸發，
#      §5.4）。
#  11. scripts/build_tsmom_base_rates.py --if-due — 季度自動重建 tsmom base
#      rate（同 rv 的 --if-due 慣例，§5.2）。
#  12. scripts/build_vrp_base_rates.py --if-due   — 季度自動重建 vrp base
#      rate（同上，§5.3）。
#  13. scripts/build_dd_verdict_base_rates.py --if-due — 季度自動重建
#      dd-verdict base rate（同上，§5.4）。
#  14. scripts/build_macro_base_rates.py --if-due — 季度自動重建 macro
#      climatology 快取（僅 base rate，harvest_macro_falsifiers.py 的 p 需
#      持有人人工賦值，不上 cron，§5.5）。
#  15. scripts/score_flowmap.py                  — flowmap 成績單：CTA／月末
#      模組對帳 forecast_history.jsonl 凍結預測 vs 實際（SPRT 序貫檢定），
#      並逐字讀入 knowledge/forecast_settlement.json 的 sources 摘要，輸出
#      docs/flowmap/data/scorecard.json（只舉旗，不改動任何模組或 CONFIG）。
#
# 排程：週一 02:00 UTC——晚於 intel-2-daily.yml 的週日 22:30 UTC 週段（含
# crowding COT 週更、timeout 90 分鐘），留出緩衝讓 data/cot_history.json 在本
# 工作流跑之前已刷新，CTA 模組對帳才吃得到當週資料。
on:
  schedule:
    - cron: "0 2 * * 1"   # 週一 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-settle-weekly
  cancel-in-progress: false

jobs:
  forecast-settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet "yfinance>=0.2.40" pandas requests

      - name: Settle forecast ledger (forecasts.jsonl)
        run: python knowledge/settle_forecasts.py

      - name: Generate monthly RV forecasts (dedupe-safe)
        run: python scripts/generate_rv_forecasts.py --write || echo "generate_rv_forecasts no-op this week (monthly dedupe rejected or no data) — continuing"

      - name: Rebuild RV base rates if due (quarterly)
        run: python scripts/build_rv_base_rates.py --if-due || echo "build_rv_base_rates --if-due not due or fetch failed — continuing with existing table"

      - name: Generate vix-model forecasts (event-triggered, dedupe-safe)
        run: python scripts/generate_vix_forecasts.py --write || echo "generate_vix_forecasts no-op this week (no onset event or dedupe rejected) — continuing"

      - name: Generate cot-model forecasts (event-triggered, dedupe-safe)
        run: python scripts/generate_cot_forecasts.py --write || echo "generate_cot_forecasts no-op this week (no extreme event or dedupe rejected) — continuing"

      - name: Rebuild vixts base rates if due (quarterly)
        run: python scripts/build_vixts_base_rates.py --if-due || echo "build_vixts_base_rates --if-due not due or fetch failed — continuing with existing table"

      - name: Rebuild COT base rates if due (quarterly)
        run: python scripts/build_cot_base_rates.py --if-due || echo "build_cot_base_rates --if-due not due or fetch failed — continuing with existing table"

      - name: Generate tsmom forecasts (monthly, dedupe-safe)
        run: python scripts/generate_tsmom_forecasts.py --write || echo "generate_tsmom_forecasts no-op this week (monthly dedupe rejected or no data) — continuing"

      - name: Generate vrp forecasts (monthly, dedupe-safe)
        run: python scripts/generate_vrp_forecasts.py --write || echo "generate_vrp_forecasts no-op this week (monthly dedupe rejected or no data) — continuing"

      - name: Generate dd-verdict forecasts (event-triggered, dedupe-safe)
        run: python scripts/generate_dd_verdict_forecasts.py --write || echo "generate_dd_verdict_forecasts no-op this week (no eligible decisions or dedupe rejected) — continuing"

      - name: Rebuild tsmom base rates if due (quarterly)
        run: python scripts/build_tsmom_base_rates.py --if-due || echo "build_tsmom_base_rates --if-due not due or fetch failed — continuing with existing table"

      - name: Rebuild vrp base rates if due (quarterly)
        run: python scripts/build_vrp_base_rates.py --if-due || echo "build_vrp_base_rates --if-due not due or fetch failed — continuing with existing table"

      - name: Rebuild dd-verdict base rates if due (quarterly)
        run: python scripts/build_dd_verdict_base_rates.py --if-due || echo "build_dd_verdict_base_rates --if-due not due or fetch failed — continuing with existing table"

      - name: Rebuild macro base rates if due (quarterly)
        run: python scripts/build_macro_base_rates.py --if-due || echo "build_macro_base_rates --if-due not due or fetch failed — continuing with existing table"

      - name: Score flowmap (frozen forecasts vs actuals)
        run: python scripts/score_flowmap.py

      - name: Commit and push if changed
        run: |
          PATHS=""
          for p in knowledge/forecasts.jsonl data/rv_base_rates.json \
                   data/rv_base_rates_raw_cache.json docs/flowmap/data/scorecard.json \
                   data/vixts_base_rates.json data/vixts_base_rates_raw_cache.json \
                   data/cot_base_rates.json data/cot_base_rates_raw_cache.json \
                   data/tsmom_base_rates.json data/tsmom_base_rates_raw_cache.json \
                   data/vrp_base_rates.json data/vrp_base_rates_raw_cache.json \
                   data/dd_verdict_base_rates.json data/dd_verdict_base_rates_raw_cache.json \
                   data/macro_base_rates.json data/macro_base_rates_raw_cache.json; do
            [ -e "$p" ] && PATHS="$PATHS $p"
          done
          if git status --porcelain $PATHS | grep -q .; then
            echo "Changes detected"
          else
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "forecast-ledger: weekly settle + flowmap scorecard ${DATE}"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            git pull --rebase --autostash origin main || { echo "Rebase failed"; exit 1; }
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1
