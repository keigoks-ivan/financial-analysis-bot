name: Daily Statistical Properties Panel

# 每日刷新統計性質面板（docs/statlab/data/latest.json）— 純機械、零 LLM。
# scripts/build_statlab.py 算三個獨立描述器模組：相關性（SPY-TLT 63d 滾動相
# 關＋11 檔 SPDR sector 兩兩 63d 滾動相關平均）、VIX 期限結構（^VIX3M−^VIX
# slope、倒掛事件表）、COT 部位極端統計（唯讀消費 data/cot_history.json 與
# data/flowmap_prices.json，只算三個模組不含任何 producer）。設計依據：
# notes/site-internal/root/_flowmap_forecast_ledger_design_20260901.md §G。
#
# cron 時段與 commit 慣例照抄 flowmap-daily.yml：yfinance 日線 bar 於美股收
# 盤後（~20:00-21:00 UTC）才落地，07:00 UTC（台北 15:00）已安全越過落地窗。
# zero-churn 寫入：資料沒動就空 diff、不 commit，重複觸發是冪等的。
on:
  schedule:
    - cron: "0 7 * * 2-6"   # Tue-Sat 07:00 UTC = 台北 15:00，美股收盤後安全窗
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statlab-daily
  cancel-in-progress: false

jobs:
  statlab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" pandas requests

      - name: Build statlab data
        run: python scripts/build_statlab.py

      - name: Commit and push if changed
        run: |
          PATHS="data/statlab_prices.json docs/statlab/data"
          if git status --porcelain $PATHS | grep -q .; then
            echo "Changes detected"
          else
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "statlab: daily data refresh ${DATE}"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            git pull --rebase --autostash origin main || { echo "Rebase failed"; exit 1; }
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1
