name: ETF Dashboard Daily Data

# ETF 股價 vs 成分股 EPS 預估修正儀表板（/etf-dash/）每日資料管線。
#
# 跑 scripts/etf_dash/build_etf_dash.py 六檔（SMH 美國掛牌 + SMH_UCITS 愛爾蘭
# 掛牌 + QQQ 那斯達克 100 + SPY 標普 500，2026-09-24 加 QQQ／SPY；2026-09-25
# 再加 TAIEX 台灣加權指數〈TWSE 公開資料機械估算近似持股〉+ 0050 元大台灣50
# 〈元大投信官方持股頁〉——見 build_etf_dash.py 對應段落的方法論註解）。
#
# 2026-09-25 加 TAIEX／0050 後 0050 的 FULL 模式抓取需要 node（parse
# Yuanta 頁面內嵌的 Nuxt SSR payload，見 build_etf_dash.py::fetch_yuanta_holdings_page
# 上方註解）——ubuntu-latest runner 本身已內建 Node.js（Actions runner 自己
# 就是用 Node 跑的），不需要額外的 actions/setup-node 步驟；找不到 node 或
# eval 失敗都會被當成整體抓取失敗，退回 holdings_cache，不會讓整個 job 掛掉。
#
# 2026-09-24 加上 tiered update（見 build_etf_dash.py 模組開頭「Tiered
# update」說明）：預設 --mode auto，每檔基金各自判斷要 FULL（持股下載＋逐檔
# eps_trend，只在台北時區週六、或 EPS 快取遺失／超過 7 天沒更新時跑）還是
# PRICE（其他六天，不下載持股、不呼叫 eps_trend，只批次抓股價跟 EPS 快取
# 重新配對）。SPY 規模到 ~500 檔，PRICE 模式把每天的 runtime 從 ~15 分鐘壓到
# 幾分鐘，也大幅降低 yfinance 限速／Invesco 406 的風險。
#
# 輸出：
#   - docs/etf-dash/data/{ETF}.json          正式頁 /etf-dash/?etf= 讀取的資料
#   - data/etf_dash/snapshots/{ETF}/{date}.json  每日快照（含 mode／eps_as_of；
#     舊版 yfinance-based EPS 指數用，見 build_etf_dash.py::build_eps_index_series；
#     現行 Exhibit 2 已改用下面的 dd_eps_history.jsonl 長線，這份快照保留供查核）
#   - data/etf_dash/eps_cache/{ETF}.json     FULL 模式存的 EPS／持股快取，PRICE
#     模式整週沿用不重抓（見 build_fund_full()／build_fund_price()）
#   - data/etf_dash/holdings_cache/{ETF}.json    VanEck 持股下載失敗時的退回快取
#   - data/etf_dash/dd_eps_history.jsonl     Exhibit 2 長線 EPS 指數的資料源
#     （scripts/etf_dash/dd_eps_history.py）——append-only JSONL，2026-05-19 起
#     docs/dd-screener/latest.json 每個 commit 日一行的窄化記錄。2026-09-24
#     從單一 dict-of-dict JSON（每次都整檔重寫，公開 repo 上單檔天天整份改
#     會讓 git 歷史膨脹）改成這個格式——正常情況每天只 append 一行，只有
#     「同一天重跑且 latest.json 內容變了」才會改動最後一行，其餘行不動。
#     本檔案一次性 backfill 需要完整 git 歷史（此 workflow 的 shallow checkout
#     沒有），所以刻意設計成「只累加今天」（append_today()，純讀 checkout
#     出來的 latest.json，不呼叫 git）——backfill 只在本機跑過一次、結果已經
#     進這份被 commit 的檔案，之後每次 workflow 執行只需要把當天併進去即可，
#     不需要 fetch-depth: 0。
#
# 這四類檔案都很小（單檔 JSON，非 stock-dash 那種 ~61MB 逐檔資料），所以刻意
# 直接進 git（不像 stock-dash 用 artifact + deploy-pages 下載那一套）——但這裡
# 的 commit 用預設 GITHUB_TOKEN push，不會觸發 deploy-pages.yml 的 push 事件
# （GitHub 反遞迴機制），故 deploy-pages.yml 的 workflow_run 清單已加入本
# workflow 名稱（"ETF Dashboard Daily Data"），跑完立即觸發重部署。
#
# 排程：2026-09-24 起主要靠 workflow_run 接在 Daily Taipei Morning Band（latest.json 刷新）成功之後；
# Tue-Sat 18:43 台北的 cron 只當備用，當天已成功就由 gate 跳過；另有 workflow_dispatch 手動。
#
# Push 迴圈與 rebase 衝突處理照 scripts/ci/ 共用腳本（見 d7995ec63 導入的全站
# pattern，monthly-eps-snapshot.yml 同款）：push 失敗就 rebase_or_flag.sh，內容
# 衝突就 retrigger_once.sh 從最新 main 重跑一次（retry=1），再撞就 ::error:: 結束
# 不再重試，避免無窮迴圈。

on:
  schedule:
    - cron: "43 10 * * 2-6"  # 備用班次：Tue-Sat 10:43 UTC = 18:43 Taipei（接力沒跑成才會真的建置，見 gate）
  # 2026-09-24：主要觸發＝接力（台北早盤帶刷新 latest.json 成功後立即跑）；GitHub 排程
  # 常延遲 2–5 小時，靠時鐘排在上游之後會讀到前一天資料。
  workflow_run:
    workflows: ["Daily Taipei Morning Band"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      retry:
        description: "內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0"
        required: false
        default: "0"
        type: string
      mode:
        description: "auto（預設）＝每檔基金各自照週六／EPS 快取新鮮度判斷 FULL 或 PRICE；full／price＝對這次全部強制指定"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "full", "price"]

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # 2026-09-24：接力觸發的閘門。workflow_run（台北早盤帶）成功才跑；schedule 是備用班次，
  # 今天（台北日期）已有成功 run 就跳過，避免重跑；workflow_dispatch 一律跑。
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          UPSTREAM: ${{ github.event.workflow_run.conclusion }}
        run: |
          run=true
          if [ "$EVENT" = "workflow_run" ] && [ "$UPSTREAM" != "success" ]; then
            echo "Upstream Daily Taipei Morning Band concluded '$UPSTREAM' — skip; fallback schedule will cover."
            run=false
          elif [ "$EVENT" = "schedule" ]; then
            today=$(TZ=Asia/Taipei date +%F)
            # 只算 build job 真的成功的 run（gate 跳過的 run 整體也是 success，不能算）
            done_today=0
            for rid in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow "etf-dash-daily.yml" --status success --limit 10 \
                --json databaseId,createdAt -q '.[] | "\(.databaseId) \(.createdAt)"' | while read -r id ts; do
                  [ "$(TZ=Asia/Taipei date -d "$ts" +%F)" = "$today" ] && echo "$id"; done); do
              ok=$(gh run view "$rid" --repo "$GITHUB_REPOSITORY" --json jobs -q '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length')
              [ "${ok:-0}" -gt 0 ] && done_today=1 && break
            done
            if [ "${done_today:-0}" -gt 0 ]; then
              echo "Already built successfully today ($today, Taipei) via chain — fallback skipped."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 2026-09-24 加 QQQ／SPY 後量級變了：四檔基金共用同一份 ticker_cache，但
    # 光 QQQ+SPY 的股票聯集就有 ~520 檔（本機實測，見 build_etf_dash.py 的
    # TICKER_FETCH_PACING_S），逐檔 yfinance eps_trend+fast_info 加上節流本機
    # 跑完整套約 15-20 分鐘；GitHub runner 網路與 yfinance 限速狀況不定，30
    # 分鐘的舊上限太緊，拉高到 45 分鐘。
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" pandas numpy requests openpyxl

      - name: Build ETF dashboard data (SMH + SMH_UCITS + QQQ + SPY + TAIEX + 0050)
        # 個別 ETF 失敗（持股來源格式改版、被擋、yfinance 掛了一整輪重試後仍
        # 失敗）只會讓 build_etf_dash.py 略過那一檔、其餘照跑；只有全部失敗它
        # 才會 non-zero exit——那種情況本步驟紅燈，後面的 commit 步驟仍會跑
        # （用 continue-on-error 讓「有部分資料」也能是 no-op 或部分更新，而
        # 不是整個 job 卡死），但至少一檔失敗時這步驟本身會在 job 摘要留紅色
        # warning。
        # 2026-09-24 tiered update（見 build_etf_dash.py 模組開頭「Tiered
        # update」說明）：--mode auto（預設，workflow_run／schedule 觸發都吃
        # 這個）讓每檔基金各自判斷 FULL（週六或 EPS 快取遺失／過舊）還是
        # PRICE（其他日子，只抓股價，EPS 沿用快取）；手動觸發可用
        # workflow_dispatch 的 mode 輸入強制全部 full 或 price。
        continue-on-error: true
        id: build
        env:
          MODE_INPUT: ${{ github.event.inputs.mode || 'auto' }}
        run: python3 scripts/etf_dash/build_etf_dash.py --etf SMH --etf SMH_UCITS --etf QQQ --etf SPY --etf TAIEX --etf 0050 --mode "$MODE_INPUT"

      - name: Fail loudly if the build step errored
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::build_etf_dash.py exited non-zero — see previous step's log. Continuing to commit whatever data/holdings-cache state exists (never worse than before this run)."

      - name: Commit and push if changed
        id: commit_and_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf_dash/snapshots/ data/etf_dash/holdings_cache/ data/etf_dash/eps_cache/ data/etf_dash/dd_eps_history.jsonl docs/etf-dash/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(TZ=Asia/Taipei date +"%Y-%m-%d")
            git commit -m "data: ETF dashboard snapshot ${DATE} (SMH + SMH_UCITS + QQQ + SPY + TAIEX + 0050)

            Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            for i in 1 2 3 4 5 6; do
              if git push; then
                exit 0
              fi
              echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
              bash scripts/ci/rebase_or_flag.sh || exit 1
              sleep $((RANDOM % 20 + 5))
            done
            echo "Push failed after 6 attempts"
            exit 1
          fi

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_and_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh
