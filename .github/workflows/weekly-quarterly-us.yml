name: Weekly US Quarterly

on:
  schedule:
    # Saturdays 00:00 UTC — quarterly data only updates after earnings, daily would waste minutes.
    # Picks up post-Friday close earnings reports + reads latest.json universe from daily-screener-us.
    - cron: "0 0 * * 6"
  workflow_dispatch:
    inputs:
      retry:
        description: >-
          內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-us-quarterly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" pandas numpy

      - name: Run US quarterly fetcher
        run: python scripts/quarterly_us.py

      - name: Commit and push if changed
        id: commit_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screener/quarterly.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "data: US quarterly refresh ${DATE}

            Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            for i in 1 2 3 4 5 6; do
              if git push; then
                exit 0
              fi
              echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
              bash scripts/ci/rebase_or_flag.sh || exit 1
              sleep $((RANDOM % 20 + 5))
            done
            echo "Push failed after 6 attempts"
            exit 1
          fi

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh
