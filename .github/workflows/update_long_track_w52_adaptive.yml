name: "Update W52 × Adaptive Vol-Target Signal (US+TW)"

on:
  schedule:
    # Two runs per weekday: TW close (13:30 Taipei + 90min buffer = 07:00 UTC)
    # and US close (16:00 ET + buffer, 21:35 UTC). The adaptive vol-target
    # sleeve reads off daily realized vol, so it updates every trading day;
    # the weekly W52 long-track gate only flips on Fridays. Forward OOS paper
    # tracking. (2026-07-28: TW leg moved 11:30→07:00 UTC to shrink the
    # close-to-run lag from ~6h to 90min; see commit for rationale.)
    - cron: '0 7 * * 1-5'
    - cron: '35 21 * * 1-5'
  workflow_dispatch:  # Manual trigger anytime
    inputs:
      test_email:
        description: 'Send a test email even without an actionable change'
        type: boolean
        default: false
      retry:
        description: >-
          內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'  # site_nav.py uses 3.12+ f-string syntax

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" pandas numpy

      - name: Run W52 × adaptive vol-target update
        run: python scripts/update_long_track_w52_adaptive.py

      - name: Run live scoreboard (PREREG 2026-09-05 forward SPRT vs diluted B&H)
        # 只用 state.json 的 source=='live' 實錄，date-keyed 冪等；讀不到資料/例外一律
        # exit 0 不動輸出檔（build_live_scoreboard.py 內建 fail-safe）。見
        # docs/Live_Scoreboard_Spec.md（v7-backtest）。
        run: python scripts/build_live_scoreboard.py

      - name: Run F70 D1X alert (paper candidate)
        # F70 紙上候選（70% 系統 A ＋ 30% D1X／TLT/GLD/DBC）：D1X 三腿部位變化／
        # 月底再平衡提醒，date-keyed state 冪等；任何例外一律 exit 0 不寫檔
        # （build_f70_alert.py 內建 fail-safe）。A 腿（QQQ/SMH）的變化已由上面
        # update_long_track_w52_adaptive.py 的 alert 通知，本步驟只描述 D1X 腿。
        # test_email 手動觸發時改跑 --test-email：只抓價寫 f70_mail.html（今天
        # 實際腿狀態），不比對前次記錄、不寫 state.json——避免測試觸發把真實
        # last_alert_date 治理狀態弄髒（見 build_f70_alert.py --test-email 說明）。
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python scripts/build_f70_alert.py --test-email
          else
            python scripts/build_f70_alert.py
          fi

      - name: Run W52 × adaptive cap 1.0 shadow control page
        # cap 1.0 (100%) shadow control page (docs/long-track-w52-adaptive/leverage.html).
        # Since 2026-07-18 main/shadow swap: LIVE main is now cap 1.5 (index.html);
        # this script writes the cap 1.0 shadow. Same two-cron schedule; NO email of its
        # own — notifications are covered by the cap 1.5 main system (alert file below).
        run: python scripts/update_long_track_w52_adaptive_leverage.py

      - name: Run TW B-ii downside-semivariance shadow tracking page
        # 2026-08-17: read-only TW-only shadow page (docs/long-track-w52-adaptive/tw-semivol.html).
        # Signal is identical to the cap 1.5 LIVE main system except the TW leg's vol-target
        # sleeve denominator (B-ii downside semivariance instead of RV20); NOT adopted as a
        # live rule (pre-registered criteria not fully met — see Adaptive_Sigma_Spec.md
        # 2026-08-17 decision record). Same two-cron schedule; NO email of its own.
        run: python scripts/update_long_track_w52_adaptive_tw_semivol.py

      - name: Run cap 1.5 no-MA legacy-rule shadow tracking page
        # 2026-09-15: read-only US+TW shadow page (docs/long-track-w52-adaptive/noma.html).
        # This is the RETIRED 2026-07-18~2026-09-14 live rule (cap fixed 1.5, no daily-MA
        # confirm layer). The daily-MA long-confirm condition that was previously tracked
        # here as a candidate is now part of the LIVE main system (cap_eff); this script
        # (renamed from update_long_track_w52_adaptive_ma_confirm.py) keeps tracking the
        # old rule as a read-only shadow for the MA-layer kill condition (rule_ledger.md).
        # Same two-cron schedule; NO email of its own.
        run: python scripts/update_long_track_w52_adaptive_noma.py

      - name: Build synthesized live mail (today conclusion + F70 MA account)
        # 2026-09-15 持有人拍板：實單信與 F70 信合成一封。build_live_mail.py 零 LLM、
        # 純組版，只讀上面兩步驟寫的 lt_w52a_alert.txt／lt_f70_alert.txt 與兩份
        # state.json，不抓價、不算訊號、不改任何 state；任一 alert 存在才寫
        # lt_live_alert.txt／live_mail.html，兩者皆無則不寫檔（exit 0）。test_email
        # 手動觸發時加 --test-email：不論 alert 有無都寫 live_mail.html（標「測試信」），
        # 但不寫 lt_live_alert.txt（避免偽造「今天有可行動變化」的紀錄）。
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python scripts/build_live_mail.py --test-email
          else
            python scripts/build_live_mail.py
          fi

      - name: Read live mail alert
        id: livealert
        run: |
          if [ -f lt_live_alert.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<LIVEALERT_EOF"
              awk 1 lt_live_alert.txt   # 保證恰好一個尾換行（不論來源檔有無），避免最後一行與 LIVEALERT_EOF 黏連
              echo "LIVEALERT_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Fail-safe: probe SMTP secret presence via env (the `secrets` context is
      # not reliable inside `if:`), then gate the email step on the result so a
      # missing secret never fails the workflow. The MAIL_USERNAME /
      # MAIL_APP_PASSWORD pair is already configured (shared with
      # update_long_track_smh.yml and 6 other workflows) — no user action needed.
      - name: Check mail secrets
        id: mailcfg
        env:
          MU: ${{ secrets.MAIL_USERNAME }}
          MP: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          if [ -n "$MU" ] && [ -n "$MP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false (SMTP secrets missing — email skipped)" >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email actionable change (synthesized US+TW live + F70)
        # 2026-09-15 起：原本「實單信」與「F70 信」兩封合成這一封，內容＝今天結論
        # （美＋台四腿）＋ F70 均線版帳戶表＋兩邊 alert 原文（見 build_live_mail.py）。
        if: (steps.livealert.outputs.changed == 'true' || inputs.test_email == true) && steps.mailcfg.outputs.ready == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "⚡ 實單系統 可行動變化（美＋台＋F70）${{ steps.livealert.outputs.changed == 'true' && '' || '(測試信)' }}"
          to: keigoks@gmail.com
          from: InvestMQuest Signals <${{ secrets.MAIL_USERNAME }}>
          html_body: file://live_mail.html
          body: |
            ${{ steps.livealert.outputs.changed == 'true' && steps.livealert.outputs.body || '這是測試信 — email 推播管線正常。目前無可行動變化。' }}

            —
            InvestMQuest · 實單系統合成信（美＋台＋F70，2026-09-15 起取代原本的實單信與 F70 信）
            每交易日台股/美股收盤後自動檢查 · 可行動變化＝美/台任一腿最終權重與現持差 ≥ 20pp 或 F70 D1X 腿部位變化／月底再平衡
            退訂：移除 repo secret MAIL_APP_PASSWORD 或編輯 update_long_track_w52_adaptive.yml

      - name: Commit and push
        id: commit_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add docs/long-track-w52-adaptive/_body.html docs/long-track-w52-adaptive/state.json docs/long-track-w52-adaptive/leverage.html docs/long-track-w52-adaptive/leverage_state.json docs/long-track-w52-adaptive/tw-semivol.html docs/long-track-w52-adaptive/tw_semivol_state.json docs/long-track-w52-adaptive/noma.html docs/long-track-w52-adaptive/noma_state.json docs/market/data/live_scoreboard.json docs/long-track/_scoreboard_body.html docs/long-track/f70_signal_state.json
          git diff --staged --quiet || git commit -m "Auto update W52 × adaptive vol-target (US+TW): $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            bash scripts/ci/rebase_or_flag.sh || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh
