name: "Update W52 × Adaptive Vol-Target Signal (US+TW)"

on:
  schedule:
    # Two runs per weekday: TW close (13:30 Taipei + 90min buffer = 07:00 UTC)
    # and US close (16:00 ET + buffer, 21:35 UTC). The adaptive vol-target
    # sleeve reads off daily realized vol, so it updates every trading day;
    # the weekly W52 long-track gate only flips on Fridays. Forward OOS paper
    # tracking. (2026-07-28: TW leg moved 11:30→07:00 UTC to shrink the
    # close-to-run lag from ~6h to 90min; see commit for rationale.)
    - cron: '0 7 * * 1-5'
    - cron: '35 21 * * 1-5'
    # 2026-11-08：週五 21:35 UTC 那班常拖過 UTC 午夜，抓不到 Yahoo 還沒定稿的週五美股收盤，週末又沒有下一班，
    # 頁面會停在週四（2026-11-07 QQQ 水位因此寫錯）。週六台北 14:17 補跑一次。
    - cron: '17 6 * * 6'
    # 2026-11-09：平日 21:35 UTC 那班同樣常拖過 UTC 午夜、讀不到當天美股收盤，下一班 07:00 UTC 又常拖到美股開盤後；
    # 月底收盤落在平日時，月線訊號可能開盤後才進系統。台北中午補跑一次（台股當天那根未到 14:15 不採用，不影響台股）。
    - cron: '17 4 * * 2-5'
    # 2026-11-10：原 supertrend-alert.yml 的週五預警（台北週五 14:40）併進這條線，時間不變。live_notify.py 只在台北週五
    # 14:15 以後才做預警，所以 07:00 UTC 那班也會補做（同一根 K 棒、同一方向只預警一次）。
    # 2026-11-24 起預警不另發，併進 trade-digest.yml 台股週五那一則。
    - cron: '40 6 * * 5'
  workflow_dispatch:  # Manual trigger anytime
    inputs:
      # 2026-11-24 起實單不自己寄信、發 Discord（改由 trade-digest.yml 每個市場每天發一則），test_email 輸入拿掉；
      # 想看訊息長相用 trade-digest.yml 的 dry_run。
      retry:
        description: >-
          內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Start from the latest main
        # 2026-11-10：排隊中的 run 會用排進佇列當下的 commit 起跑。週五 14:40（預警）與 15:00 兩班只差 20 分鐘，
        # 後一班常在前一班推送前就排進佇列，會拿舊的 state.json 比對、把同一個變化再寄一次。起跑前先對齊最新 main；
        # 抓不到就照原本的 checkout 繼續。
        run: git fetch --quiet --depth=1 origin main && git reset --quiet --hard FETCH_HEAD || echo "::warning::fetch latest main failed; using the checked-out commit"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'  # site_nav.py uses 3.12+ f-string syntax

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" pandas numpy

      - name: Run W52 × adaptive vol-target update (LIVE main system)
        # 2026-11-04 收盤的訊號起，指數部四檔改 Supertrend 週線＋月線（持有人 2026-11-04 拍板，生效日見 scripts/supertrend_core.py）；
        # 債金疊加照舊。檔名與步驟名稱沿用舊稱，免得改動排程與引用。
        # 2026-10-19 起實盤主系統：美股債金版（股票上限 100% 不借錢＋IEF／GLD 週線疊加）、
        # 台股不借錢版（上限 100%）。生效日前的紀錄按舊規則保留、不改寫（state.json 每筆帶 rule 標籤）。
        # 可行動變化寫 lt_w52a_alert.txt（含債金條件數改變），由下方 trade_digest.py capture 存下、trade-digest.yml 發出。
        run: python scripts/update_long_track_w52_adaptive.py

      # 2026-11-10 持有人拍板停更 cap 1.5 對照線（--profile cap15）：不寄信、不影響下單，只花執行時間。
      # cap15.html／cap15_state.json 留最後一版，頁首有「2026-11-10 起停止更新」橫幅（scripts/archive_banner.py 的 CONTROL_STOP）。
      # 沒有退回條件或回顧讀它的每日數字（記分板只讀 state.json；讀 cap15_state.json 的只剩已歸檔、不在 CI 的腳本）。

      - name: Run W52 control line (former LIVE rule before Supertrend)
        # 2026-11-04 收盤的訊號起實單指數部改 Supertrend；原規則（W52 × 自適應 × A2，債金照舊）以 --profile w52
        # 續跑成對照線，每日更新、不寄信、不寫 alert。輸出 w52_state.json／w52.html。失敗不擋實單更新。
        # 2026-11-10 持有人原想一併停更，但 NFCI 前瞻影子線（事前登記 2026-10-18、2029-10-19 起判）每天讀
        # w52_state.json 的目標水位，停了會讓登記中的測試斷資料，所以先照跑，等持有人決定（見規則帳本 2026-11-10）。
        # 第一次執行會從實單 state.json 複製 Supertrend 生效日前的 history，之後各自往下走。
        continue-on-error: true
        run: python scripts/update_long_track_w52_adaptive.py --profile w52

      - name: Run live scoreboard (PREREG 2026-09-05 forward SPRT vs diluted B&H)
        # 只用 state.json 的 source=='live' 實錄，date-keyed 冪等；讀不到資料/例外一律
        # exit 0 不動輸出檔（build_live_scoreboard.py 內建 fail-safe）。見
        # docs/Live_Scoreboard_Spec.md（v7-backtest）。
        run: python scripts/build_live_scoreboard.py

      - name: Rebuild /long-track/ overview "today" strip
        # 總覽分頁「今天」區塊只讀 state.json＋live_scoreboard.json、不重算；
        # 先前沒接進排程，總覽停在 2026-09-18 的數字。失敗不擋實單更新。
        continue-on-error: true
        run: python scripts/build_long_track_index.py

      # 2026-10-18 影子／對照線整理（持有人拍板）：下列線停止每日更新、頁面歸檔（頁頂有歸檔橫幅，
      # 內容凍結）；腳本都留在 scripts/，要重產可手動跑，但 CI 不再跑：
      #   F70 D1X alert（build_f70_alert.py）、不借錢版頁（..._leverage.py）、台股下跌半變異（..._tw_semivol.py）、
      #   舊規則版 noma（..._noma.py）、債金版頁（..._c1.py）；黃金單腿 GLD 與商品組合另在各自的 workflow 停掉。
      # 注意：實單主腳本 import ..._c1（債金條件的計算）與 ..._leverage（回測區塊常數），所以這兩支腳本與
      # c1_backtest.json 不能刪。對照線 cap15 自 2026-11-10 起也停止更新（見上方）。
      # 原先接在這裡的「總覽再重建一次」只是為了讓影子表追上當日，影子表已移除，故一併拿掉。

      - name: Friday warning, SMH London reference (for trade digest)
        # 週五預警與 SMH 倫敦版（UCITS）翻轉參考 2026-11-10 起由這裡做（原 supertrend-alert.yml，排程已停），結果寫 live_extra.json。
        # live_notify.py 也照舊寫 live_confirm.txt 與 data/live_notify/state.json（週五預警、SMH.L 的去重狀態在這個檔），
        # 但 2026-11-24 起 live_confirm.txt 不再貼到 Discord：每日確認改由 trade-digest.yml 的每日一則負責。
        # 除了 SMH 倫敦版不抓價、不改 state.json；失敗不擋實單更新。
        continue-on-error: true
        run: python scripts/live_notify.py

      - name: Capture alert text for trade digest
        # 2026-11-24 持有人拍板 #調倉 每個市場每個收盤日只發一則（scripts/trade_digest.py、trade-digest.yml）：
        # 這裡不再寄實單信、不再發 ⚡ 與每日確認行，只把這一班的提醒原文（lt_w52a_alert.txt 的事件行、「怎麼下單」、
        # 為什麼變）、週五預警、SMH 倫敦翻轉存進 data/live_digest/live_capture.json，跟 state.json 同一個 commit 推上去，
        # trade-digest.yml 讀它組訊息、拿「怎麼下單」對數。下單數字由 trade_digest.py 直接讀 state.json。失敗不擋實單更新
        # （trade-digest 少了提醒原文時改用 state.json 的 last_change_desc，只少週五預警與倫敦參考）。
        continue-on-error: true
        run: python scripts/trade_digest.py capture

      - name: Commit and push
        id: commit_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add docs/long-track-w52-adaptive/_body.html docs/long-track-w52-adaptive/state.json docs/long-track-w52-adaptive/w52.html docs/long-track-w52-adaptive/w52_state.json docs/market/data/live_scoreboard.json docs/long-track/_scoreboard_body.html docs/long-track/index.html
          if [ -f data/live_notify/state.json ]; then git add data/live_notify/state.json; fi
          if [ -f data/live_digest/live_capture.json ]; then git add data/live_digest/live_capture.json; fi
          git diff --staged --quiet || git commit -m "Auto update W52 × adaptive vol-target (US+TW): $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            bash scripts/ci/rebase_or_flag.sh || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1

      # 2026-10-31：本 workflow 完成後，nfci-forward-shadow.yml 與 deploy-pages.yml 的 workflow_run
      # 從 10-19 起一次都沒被觸發（NFCI 影子線 0 次執行；10-29 起 74 次連動部署 0 次來自本 workflow；
      # 名稱全英文的 NFCI workflow 推送後 6 秒內就觸發部署）。deploy-pages 監聽的 31 個 workflow 裡，
      # 只有本 workflow 名稱含非 ASCII 字元（×），也只有它從未觸發；疑似名稱比對失敗，未證實。
      # 改為明確派送；失敗不影響本 workflow（實單資料已推送）。若 workflow_run 之後恢復，NFCI 會多跑一次，
      # 它有 concurrency 排隊且整段重算，結果相同。
      # 2026-11-24 起加派 trade-digest.yml（#調倉 每日一則），它讀剛推上去的 state.json 與 live_capture.json。
      - name: Dispatch NFCI shadow, Pages deploy, trade digest
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run trade-digest.yml --ref main -f market=all -f retry=0 || echo "::warning::trade-digest dispatch failed; its cron will pick it up"
          gh workflow run nfci-forward-shadow.yml --ref main -f retry=0
          gh workflow run deploy-pages.yml --ref main

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh

      - name: Discord notify on failure
        if: failure() && !(steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1')
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TRADE }}
          NOTIFY_TITLE: "排程失敗：實單訊號 update_long_track_w52_adaptive"
          NOTIFY_BODY: "實單訊號 update_long_track_w52_adaptive 執行失敗：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python3 scripts/notify_discord.py --title-env NOTIFY_TITLE --body-env NOTIFY_BODY --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
