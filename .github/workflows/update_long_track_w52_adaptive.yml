name: "Update W52 × Adaptive Vol-Target Signal (US+TW)"

on:
  schedule:
    # Two runs per weekday: TW close (13:30 Taipei + 90min buffer = 07:00 UTC)
    # and US close (16:00 ET + buffer, 21:35 UTC). The adaptive vol-target
    # sleeve reads off daily realized vol, so it updates every trading day;
    # the weekly W52 long-track gate only flips on Fridays. Forward OOS paper
    # tracking. (2026-07-28: TW leg moved 11:30→07:00 UTC to shrink the
    # close-to-run lag from ~6h to 90min; see commit for rationale.)
    - cron: '0 7 * * 1-5'
    - cron: '35 21 * * 1-5'
  workflow_dispatch:  # Manual trigger anytime
    inputs:
      test_email:
        description: 'Send a test email even without an actionable change'
        type: boolean
        default: false
      retry:
        description: >-
          內部用：rebase 衝突後自我重跑時帶 1，防無限迴圈；手動觸發留 0
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'  # site_nav.py uses 3.12+ f-string syntax

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" pandas numpy

      - name: Run W52 × adaptive vol-target update (LIVE main system)
        # 2026-10-19 起實盤主系統：美股債金版（股票上限 100% 不借錢＋IEF／GLD 週線疊加）、
        # 台股不借錢版（上限 100%）。生效日前的紀錄按舊規則保留、不改寫（state.json 每筆帶 rule 標籤）。
        # 可行動變化寫 lt_w52a_alert.txt（含債金條件數改變），由下方 build_live_mail.py 合成寄出。
        run: python scripts/update_long_track_w52_adaptive.py

      - name: Run old-rule control line (cap 1.5 + daily-MA confirm, former LIVE rule)
        # 2026-10-19 起：原實盤規則（cap 1.5＋日線均線確認）降為對照線，每日照常更新、不寄信
        # （--profile cap15 不寫 alert、不動 lt_w52a_alert.txt）。輸出 cap15_state.json／cap15.html。
        # 必須在記分板之前跑。（2026-10-18 起 C1／noma／tw-semivol 影子已歸檔、不再讀它。）
        # 失敗不擋實單更新。
        continue-on-error: true
        run: python scripts/update_long_track_w52_adaptive.py --profile cap15

      - name: Run live scoreboard (PREREG 2026-09-05 forward SPRT vs diluted B&H)
        # 只用 state.json 的 source=='live' 實錄，date-keyed 冪等；讀不到資料/例外一律
        # exit 0 不動輸出檔（build_live_scoreboard.py 內建 fail-safe）。見
        # docs/Live_Scoreboard_Spec.md（v7-backtest）。
        run: python scripts/build_live_scoreboard.py

      - name: Rebuild /long-track/ overview "today" strip
        # 總覽分頁「今天」區塊只讀 state.json＋live_scoreboard.json、不重算；
        # 先前沒接進排程，總覽停在 2026-09-18 的數字。失敗不擋實單更新。
        continue-on-error: true
        run: python scripts/build_long_track_index.py

      # 2026-10-18 影子／對照線整理（持有人拍板）：下列線停止每日更新、頁面歸檔（頁頂有歸檔橫幅，
      # 內容凍結）；腳本都留在 scripts/，要重產可手動跑，但 CI 不再跑：
      #   F70 D1X alert（build_f70_alert.py）、不借錢版頁（..._leverage.py）、台股下跌半變異（..._tw_semivol.py）、
      #   舊規則版 noma（..._noma.py）、債金版頁（..._c1.py）；黃金單腿 GLD 與商品組合另在各自的 workflow 停掉。
      # 注意：實單主腳本 import ..._c1（債金條件的計算）與 ..._leverage（回測區塊常數），所以這兩支腳本與
      # c1_backtest.json 不能刪。對照線 cap15 照常每日更新。
      # 原先接在這裡的「總覽再重建一次」只是為了讓影子表追上當日，影子表已移除，故一併拿掉。

      - name: Build synthesized live mail (today conclusion + bond/gold overlay)
        # 2026-10-19 起：實單 alert 含「美股債金條件數改變」與「現持高於新上限」；舊 cap 1.5 規則
        # （cap15 對照線）不寫 alert、不寄信。
        # 2026-09-15 持有人拍板：實單信與 F70 信合成一封；2026-10-18 F70 歸檔，信裡不再有 F70。
        # build_live_mail.py 零 LLM、純組版，只讀上面步驟寫的 lt_w52a_alert.txt 與
        # state.json，不抓價、不算訊號、不改任何 state；任一 alert 存在才寫
        # lt_live_alert.txt／live_mail.html，兩者皆無則不寫檔（exit 0）。test_email
        # 手動觸發時加 --test-email：不論 alert 有無都寫 live_mail.html（標「測試信」），
        # 但不寫 lt_live_alert.txt（避免偽造「今天有可行動變化」的紀錄）。
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python scripts/build_live_mail.py --test-email
          else
            python scripts/build_live_mail.py
          fi

      - name: Read live mail alert
        id: livealert
        run: |
          if [ -f lt_live_alert.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<LIVEALERT_EOF"
              awk 1 lt_live_alert.txt   # 保證恰好一個尾換行（不論來源檔有無），避免最後一行與 LIVEALERT_EOF 黏連
              echo "LIVEALERT_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Fail-safe: probe SMTP secret presence via env (the `secrets` context is
      # not reliable inside `if:`), then gate the email step on the result so a
      # missing secret never fails the workflow. The MAIL_USERNAME /
      # MAIL_APP_PASSWORD pair is already configured (shared with
      # update_long_track_smh.yml and 6 other workflows) — no user action needed.
      - name: Check mail secrets
        id: mailcfg
        env:
          MU: ${{ secrets.MAIL_USERNAME }}
          MP: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          if [ -n "$MU" ] && [ -n "$MP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false (SMTP secrets missing — email skipped)" >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email actionable change (synthesized US+TW live)
        # 2026-09-15 起：原本「實單信」與「F70 信」兩封合成這一封；2026-10-18 起 F70 歸檔，內容＝今天結論
        # （美＋台四腿）＋債金疊加＋alert 原文（見 build_live_mail.py）。
        if: (steps.livealert.outputs.changed == 'true' || inputs.test_email == true) && steps.mailcfg.outputs.ready == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "⚡ 實單系統 可行動變化（美＋台）${{ steps.livealert.outputs.changed == 'true' && '' || '(測試信)' }}"
          to: keigoks@gmail.com
          from: InvestMQuest Signals <${{ secrets.MAIL_USERNAME }}>
          html_body: file://live_mail.html
          body: |
            ${{ steps.livealert.outputs.changed == 'true' && steps.livealert.outputs.body || '這是測試信 — email 推播管線正常。目前無可行動變化。' }}

            —
            InvestMQuest · 實單系統合成信（美＋台；2026-10-18 起不含 F70）
            每交易日台股／美股收盤後自動檢查 · 可行動變化＝任一檔目標水位比現持低一格（20%）以上或高兩格（40%）以上、現持高於規則上限，或美股公債／黃金週線條件數改變
            退訂：移除 repo secret MAIL_APP_PASSWORD 或編輯 update_long_track_w52_adaptive.yml

      - name: Discord notify (live system)
        if: (steps.livealert.outputs.changed == 'true' || inputs.test_email == true) && steps.mailcfg.outputs.ready == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_TRADE }}
          NOTIFY_TITLE: "⚡ 實單系統 可行動變化（美＋台）${{ steps.livealert.outputs.changed == 'true' && '' || '(測試信)' }}"
          NOTIFY_BODY: "${{ steps.livealert.outputs.changed == 'true' && steps.livealert.outputs.body || '這是測試信 — email 推播管線正常。目前無可行動變化。' }}"
        run: python3 scripts/notify_discord.py --title-env NOTIFY_TITLE --body-env NOTIFY_BODY --url https://research.investmquest.com/long-track/#live

      - name: Commit and push
        id: commit_push
        env:
          IS_RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add docs/long-track-w52-adaptive/_body.html docs/long-track-w52-adaptive/state.json docs/long-track-w52-adaptive/cap15.html docs/long-track-w52-adaptive/cap15_state.json docs/market/data/live_scoreboard.json docs/long-track/_scoreboard_body.html docs/long-track/index.html
          git diff --staged --quiet || git commit -m "Auto update W52 × adaptive vol-target (US+TW): $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            bash scripts/ci/rebase_or_flag.sh || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1

      # 2026-10-31：本 workflow 完成後，nfci-forward-shadow.yml 與 deploy-pages.yml 的 workflow_run
      # 從 10-19 起一次都沒被觸發（NFCI 影子線 0 次執行；10-29 起 74 次連動部署 0 次來自本 workflow；
      # 名稱全英文的 NFCI workflow 推送後 6 秒內就觸發部署）。deploy-pages 監聽的 31 個 workflow 裡，
      # 只有本 workflow 名稱含非 ASCII 字元（×），也只有它從未觸發；疑似名稱比對失敗，未證實。
      # 改為明確派送；失敗不影響本 workflow（實單資料已推送）。若 workflow_run 之後恢復，NFCI 會多跑一次，
      # 它有 concurrency 排隊且整段重算，結果相同。
      - name: Dispatch NFCI shadow and Pages deploy
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run nfci-forward-shadow.yml --ref main -f retry=0
          gh workflow run deploy-pages.yml --ref main

      - name: Self-retrigger once after rebase conflict
        if: failure() && steps.commit_push.outputs.conflict == 'true' && github.event.inputs.retry != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/retrigger_once.sh
