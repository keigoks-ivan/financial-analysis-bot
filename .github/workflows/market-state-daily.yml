name: Market State Daily

# 市況主控台合成層日更（設計稿 §1／§6 package E1：notes/site-internal/root/
# _market_cockpit_design_20260902.md）。
#
# scripts/build_market_state.py 只讀不算：彙整既有 monitor／detective／
# flowmap／statlab／intel／regime／macro clock／crowding／forecast ledger／
# decisions／exposure_track／flowmap scorecard 等既有 latest.json／帳簿／
# scorecard 為單一合成檔 docs/market/data/state.json，供 /market/ 頁面
# fetch 渲染。stdlib-only（無第三方套件依賴），缺檔不 crash（該區塊記為
# null／空並寫進 gaps[]）。
#
# 排程：一天兩班。
# ①07:30 台北（23:30 UTC，週一至週五）——緊接 intel-2 鏈（22:30 UTC）之後起
#   跑，給一份台北早班快照，讓 intel／kill-watch／detective 三塊都是當日新
#   資料；但 monitor-daily 與 flowmap-daily 仍在 07:00 UTC（台北 15:00）才
#   跑，故 07:30 這個班次裡這兩塊還停在前一個美股交易日，落後一個美股交易日。
# ②16:30 台北（08:30 UTC，週二至週六，原有班次）——晚於 monitor/detective/
#   flowmap/statlab/intel 等全部上游日更管線，是當天完整、無落後區塊的
#   full refresh。
on:
  schedule:
    - cron: "30 23 * * 1-5"   # 07:30 台北（UTC+8）＝週二至週六台北早班快照
    - cron: "30 8 * * 2-6"    # 16:30 台北＝原有完整 full refresh 班次
  workflow_dispatch:
  # 2026-09-13：成功的上游資料到齊即保存版本，定時班次保留作補漏；不在 Actions 呼叫模型。
  workflow_run:
    workflows: ["Intel 2.0 Daily Chain", "Daily Market Monitor", "Daily Conditional Flow Map", "Daily Statistical Properties Panel"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: market-state-daily
  cancel-in-progress: false

jobs:
  build-market-state:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 2026-09-13：官方資料用免費端點／免費金鑰抓取，不呼叫付費模型；部分失敗保留最後成功值。
      - name: Refresh official source history
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/market_sources.py collect --write --timeout 15 --retries 1

      - name: Build market state
        run: python scripts/build_market_state.py

      - name: Save evidence and coherent release
        run: python scripts/market_refresh.py record --write

      - name: Commit and push if changed
        run: |
          # 2026-09-13：只提交本步產物，判讀沿用上一份並明示等待重評。
          PATHS="data/market_sources docs/market/data/state.json docs/market/data/refresh.json docs/market/data/snapshots docs/market/data/releases"
          if git status --porcelain $PATHS | grep -q .; then
            echo "Changes detected"
          else
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          DATE=$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M")
          git commit -m "market-state: daily synthesis refresh ${DATE}"
          for i in 1 2 3 4 5 6; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed (likely concurrent push); rebasing onto origin/main..."
            git pull --rebase origin main || { echo "Rebase failed; rebuild against latest evidence"; exit 1; }
            sleep $((RANDOM % 20 + 5))
          done
          echo "Push failed after 6 attempts"
          exit 1
