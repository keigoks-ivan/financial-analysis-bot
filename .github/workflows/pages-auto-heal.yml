name: Pages Auto-Heal

# v3（2026-11-09）：改成「最新 Deploy Pages run 失敗 → 派一次新的部署」。
# 原本的 `gh run rerun --failed` 只重跑部署那一步，會因同一次 run 有兩份 github-pages 部署檔而失敗
# （"Multiple artifacts named github-pages"，run 42529060351 第 2 次），所以失敗的部署從來補不回來。
# 同一個 commit 最多派到 3 次，GitHub 自己故障時不會每 15 分鐘一直重派；有新 commit 就重新計算。

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pages-auto-heal
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch a fresh deploy if the latest Deploy Pages run failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_DISPATCH: "3"
        run: |
          set -e
          R=$(gh run list --repo "$REPO" --workflow deploy-pages.yml --branch main --limit 1 \
              --json databaseId,status,conclusion,headSha \
              --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion) \(.headSha)"' || true)
          if [ -z "$R" ]; then echo "no deploy runs yet"; exit 0; fi
          ID=$(echo "$R" | awk '{print $1}')
          ST=$(echo "$R" | awk '{print $2}')
          CC=$(echo "$R" | awk '{print $3}')
          SHA=$(echo "$R" | awk '{print $4}')
          echo "latest deploy run: $ID $ST $CC $SHA"
          case "$ST $CC" in
            "completed failure"|"completed timed_out"|"completed startup_failure") ;;
            *) echo "→ nothing to heal"; exit 0 ;;
          esac
          N=$(gh run list --repo "$REPO" --workflow deploy-pages.yml --branch main --event workflow_dispatch --limit 30 \
              --json headSha --jq "[.[] | select(.headSha == \"$SHA\")] | length")
          echo "manual dispatches already on this commit: $N"
          if [ "$N" -ge "$MAX_DISPATCH" ]; then
            echo "→ reached $MAX_DISPATCH dispatches on this commit, waiting for the next commit"
            exit 0
          fi
          echo "→ dispatching a fresh deploy"
          gh workflow run deploy-pages.yml --repo "$REPO" --ref main
