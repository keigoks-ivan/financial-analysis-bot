name: Market Read Notify

# 市況判讀 email 摘要通知（設計稿 §5.1／§5.5：notes/site-internal/root/
# _market_read_design_20260903.md）。
#
# 零 LLM：判讀本身由雲端 routine market-read-auto（或 orchestrator 手動跑
# market-read skill）產生並 push 到 main；本工作流只在 read.json 或
# read_status.json 變動時被 push 事件觸發，跑 scripts/market_read_summary.py
# 產生美化版 HTML 信＋純文字備援＋主旨，寄一封摘要 email 給持有人（版型標準：
# _market_read_design_20260903.md §5.7）。判讀成功寄摘要；read_status.json.
# status=failed 時寄失敗信（含原因）——分支邏輯全部收在 market_read_summary.py
# 內，本工作流只是把腳本輸出（HTML／純文字檔＋主旨）轉寄出去。

on:
  push:
    branches: [main]
    paths:
      - docs/market/data/read.json
      - docs/market/data/read_status.json

permissions:
  contents: read

concurrency:
  group: market-read-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Skip if this read was already notified
        id: dedupe
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # 只有 read.json 換了新一份判讀（generated_at 變）或 read_status.json
          # 內容變了才寄；同一份判讀後來被手動修字的 push 不重寄。
          # 抓不到上一版（首推、force push）就照寄。
          key() { python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('generated_at',''))" "$1"; }
          NEW="$(key docs/market/data/read.json)|$(cat docs/market/data/read_status.json)"
          OLD=""
          if git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
            mkdir -p .prev
            git show "$BEFORE:docs/market/data/read.json" > .prev/read.json 2>/dev/null \
              && git show "$BEFORE:docs/market/data/read_status.json" > .prev/read_status.json 2>/dev/null \
              && OLD="$(key .prev/read.json)|$(cat .prev/read_status.json)"
          fi
          if [ -n "$OLD" ] && [ "$OLD" = "$NEW" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "Same read (generated_at + status unchanged) — skip email／Discord."
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build market-read summary (HTML + text + subject)
        id: summary
        if: steps.dedupe.outputs.send == 'true'
        run: |
          OUTPUT="$(python3 scripts/market_read_summary.py --html market_read_mail.html --text market_read_mail.txt)"
          SUBJECT="$(printf '%s\n' "$OUTPUT" | sed -n '1p')"
          DELIM="EOF_$(date +%s%N)_${RANDOM}"
          {
            echo "subject<<$DELIM"
            printf '%s\n' "$SUBJECT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Email market-read summary
        if: steps.dedupe.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: ${{ steps.summary.outputs.subject }}
          to: keigoks@gmail.com
          from: InvestMQuest Signals <${{ secrets.MAIL_USERNAME }}>
          html_body: file://market_read_mail.html
          body: file://market_read_mail.txt

      - name: Discord notify (market read)
        if: steps.dedupe.outputs.send == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MARKET }}
          NOTIFY_TITLE: ${{ steps.summary.outputs.subject }}
        run: python3 scripts/notify_discord.py --title-env NOTIFY_TITLE --body-file market_read_mail.txt --url https://research.investmquest.com/market/
