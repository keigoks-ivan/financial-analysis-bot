name: revmom 官方資料連線測試（手動）

# 只在手動觸發時跑：確認 GitHub runner 能不能連到證交所、櫃買、公開資訊觀測站（月營收動能名單的資料來源）。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official endpoints
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import urllib.request, time
          H = {"User-Agent": "Mozilla/5.0"}
          urls = {
            "twse_MI_INDEX": "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20260930&type=ALLBUT0999&response=json",
            "twse_FMTQIK": "https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date=20260901&response=json",
            "twse_TWT49U": "https://www.twse.com.tw/rwd/zh/exRight/TWT49U?startDate=20260101&endDate=20261231&response=json",
            "tpex_dailyQuotes": "https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026%2F09%2F30&type=EW&response=json",
            "tpex_exDailyQ": "https://www.tpex.org.tw/www/zh-tw/bulletin/exDailyQ?startDate=2026%2F01%2F01&endDate=2026%2F12%2F31&response=json",
            "mops_t21_sii_115_9_0": "https://mopsov.twse.com.tw/nas/t21/sii/t21sc03_115_9_0.html",
            "mops_t21_sii_115_8_0": "https://mopsov.twse.com.tw/nas/t21/sii/t21sc03_115_8_0.html",
          }
          print("| endpoint | status | bytes | head |\n|---|---|---|---|")
          for k, u in urls.items():
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60) as r:
                      b = r.read(); st = r.status
                  head = b[:80].decode("utf-8", "ignore").replace("\n", " ").replace("|", "/")
                  if b"stat" in b[:200] or k.startswith("mops"):
                      pass
                  print(f"| {k} | {st} | {len(b)} | {head} |")
              except Exception as e:
                  print(f"| {k} | ERR | 0 | {type(e).__name__}: {str(e)[:80]} |")
              time.sleep(3)
          PY
