<style>
:root{
  --up:#c0392b; --down:#1e8e5a;            /* 台股慣例：紅＝買超／上漲，綠＝賣超／下跌 */
  --c1:#173564; --c2:#a77c2a; --c3:#2f8577; --c4:#7a4fa3; --idx:#8996ab;
  --chip-bg:#f1ece0;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#eef1f6; --body:#d3dae6; --sec:#a3afc2; --muted:#7f8ca0;
    --paper:#0e1522; --card:#151e2f; --line:#2a364b; --line-soft:#1f2a3d;
    --accent:#8fb0cf; --gold-deep:#d4b576; --gold-bg:#2a2414; --gold-soft:#4a3d1c;
    --up:#ff6b61; --down:#4cc38a;
    --c1:#8fb0cf; --c2:#e0b95c; --c3:#5fcab8; --c4:#b79ae0; --idx:#6f7f98;
    --chip-bg:#1c2639;
  }

*{box-sizing:border-box;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--body);line-height:1.6;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px}

.asof{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px}

/* 控制列：區間按鈕 */
.ctl{position:sticky;top:var(--nav-h,52px);z-index:50;background:var(--paper);padding:8px 0;border-bottom:1px solid var(--line);margin-top:10px}
.ctl-inner{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.ctl-label{font-size:12px;color:var(--sec)}
.rng{display:flex;flex-wrap:wrap;gap:4px}
.rng button{font-family:var(--mono);font-size:12px;font-weight:600;padding:.3rem .65rem;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--body);cursor:pointer}
.rng button:hover{border-color:var(--accent)}
.rng button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
@media (prefers-color-scheme: dark){ .rng button.on{color:#0e1522} }

/* 最新數字小卡 */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh-1)}
.card .k{font-size:11.5px;color:var(--sec);margin-bottom:2px}
.card .v{font-family:var(--mono);font-size:1.15rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.card .s{font-family:var(--mono);font-size:11.5px;color:var(--sec);font-variant-numeric:tabular-nums}
.card .d{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px}
.up{color:var(--up)} .dn{color:var(--down)}
@media (max-width:900px){ .cards{grid-template-columns:repeat(3,1fr)} }
@media (max-width:560px){ .cards{grid-template-columns:repeat(2,1fr)} .card .v{font-size:1.02rem} }

/* 圖區塊 */
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:16px 0;padding:14px 14px 10px;box-shadow:var(--sh-1)}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.sec-head h2{margin:0;font-family:var(--sans);font-size:1rem;font-weight:700;color:var(--ink)}
.sec-head .n{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-right:2px}
.sec-head .latest{font-family:var(--mono);font-size:.9rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sec-head .latest small,.sec-head .chg small{font-weight:400;color:var(--muted);font-size:.72rem}
.sec-head .chg{font-family:var(--mono);font-size:.82rem;color:var(--sec);font-variant-numeric:tabular-nums}
.sec-head .cumhd{flex-basis:100%;font-size:.78rem}
.sec-head .tools{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--sec)}
.tools label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.tools select{font:inherit;font-size:12px;padding:.15rem .3rem;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--body)}
.hint{margin:4px 0 8px;font-size:12.5px;color:var(--sec);line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:4px 8px;margin:0 0 6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:.1rem .5rem;border-radius:999px;background:var(--chip-bg);color:var(--body);cursor:pointer;user-select:none;border:1px solid transparent}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip.off{opacity:.4;text-decoration:line-through}
.sub-title{font-size:11.5px;color:var(--muted);margin:8px 0 2px}
.cbox{position:relative;width:100%}
.cbox + .cbox{margin-top:6px}
.readout{position:absolute;left:86px;top:4px;z-index:5;pointer-events:none;font-family:var(--mono);font-size:11px;line-height:1.45;background:color-mix(in srgb,var(--card) 82%,transparent);padding:2px 6px;border-radius:5px;color:var(--body);max-width:calc(100% - 140px)}
.readout b{font-weight:600;color:var(--ink)}
.readout i{display:inline-block;width:7px;height:7px;border-radius:2px;margin:0 3px 0 8px;vertical-align:baseline}
.readout i:first-of-type{margin-left:4px}
@media (max-width:640px){ .readout{left:70px;max-width:calc(100% - 76px)} }
.note{font-size:11.5px;color:var(--muted);margin:4px 0 0}

/* 頁尾資料來源 */
.src{margin-top:26px}
.src h2{font-size:1rem;color:var(--ink);margin:0 0 8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.src table{width:100%;border-collapse:collapse;font-size:12.5px}
.src th{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--sec);text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
.src td{padding:.45rem .7rem;border-bottom:1px solid var(--line-soft);color:var(--body);vertical-align:top}
.src td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.src .fine{font-size:12px;color:var(--sec);line-height:1.8;margin-top:10px}
.fcast .lead{margin:6px 0 8px;font-size:14px;color:var(--ink);line-height:1.7}
.fcast p{margin:0 0 10px;font-size:13px;color:var(--body);line-height:1.8}
.fcast .tbl-wrap{margin:10px 0}
.fcast table{width:100%;border-collapse:collapse;font-size:12.5px}
.fcast th{font-size:11.5px;font-weight:600;color:var(--sec);text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
.fcast td{padding:.45rem .7rem;border-bottom:1px solid var(--line-soft);color:var(--body);vertical-align:top}
.fcast td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.fcast .note{line-height:1.7}
.err{padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--down)}
</style>

<script>
(function(){
'use strict';
var LWC = window.LightweightCharts;
var V = String(Date.now()).slice(0,8);   // 資料檔快取：每約 11 天自然換一次，另由 meta.updated 補強
var FILES = ['cal','price','inst','margin','sbl','dtrade','otc','fut','mtx','basis','opt','pcr','large','fx','meta'];
var D = {}, CAL = [], CAL_IDX = {};
var charts = [];            // 所有圖：{chart, box, readout, series:[{def,api}], overlay, ...}
var syncing = false;
var curMonths = 12;

function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function theme(){
  return {bg:css('--card'), text:css('--body'), grid:css('--line-soft'), border:css('--line'),
    up:css('--up'), down:css('--down'), c1:css('--c1'), c2:css('--c2'), c3:css('--c3'), c4:css('--c4'),
    idx:css('--idx'), ref:css('--muted')};
}
var FMT = {
  int:function(v){ return v==null?'—':Math.round(v).toLocaleString('en-US'); },
  d1:function(v){ return v==null?'—':v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}); },
  d2:function(v){ return v==null?'—':v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); },
  sgn:function(f){ var g=function(v){ return v==null?'—':(v>0?'+':'')+f(v); }; g.p=f.p; return g; }
};
FMT.int.p=0; FMT.d1.p=1; FMT.d2.p=2;
function firstIdx(arr){ for(var i=0;i<arr.length;i++){ if(arr[i]!=null) return i; } return -1; }
function lastIdx(arr){ for(var i=arr.length-1;i>=0;i--){ if(arr[i]!=null) return i; } return -1; }
function valBack(arr, i, n){            // i 往前 n 個交易日；該日沒值就往前找最多 5 天
  var j = i - n;
  for(var k=0;k<=5 && j-k>=0;k++){ if(arr[j-k]!=null) return arr[j-k]; }
  return null;
}
function sumLast(arr, i, n){ var s=0; for(var k=0;k<n;k++){ var v=arr[i-k]; if(v==null) return null; s+=v; } return s; }

/* ---------------- 圖表定義 ---------------- */
// kind: line | hist | candle；col: 主題色 key；sign: 柱狀圖依正負上色（紅買超／綠賣超）
function buildSpecs(){
  var P=D.price, I=D.inst, M=D.margin, B=D.sbl, F=D.fut, O=D.opt, R=D.pcr, L=D.large, X=D.fx, DT=D.dtrade, OT=D.otc, MX=D.mtx, BS=D.basis;
  var optWho = {f:'外資', t:'投信', dl:'自營商'};
  return [
  {id:'price', n:'1', title:'加權指數日 K 線與成交金額', height:380, overlay:false, volume:true,
   head:{arr:P.c, fmt:FMT.d2, unit:'點', delta:'diff', dfmt:FMT.sgn(FMT.d2)},
   hint:'K 線紅漲綠跌，下方灰柱是全市場成交金額（億元）。20 日、60 日、240 日均線大致相當於月線、季線、年線；指數站在年線上方、三條均線同向上，代表中長期趨勢向上。',
   series:[
     {k:'c', name:'加權指數', kind:'candle', o:P.o, h:P.h, l:P.l, arr:P.c, fmt:FMT.d2},
     {k:'ma20', name:'20 日', kind:'line', arr:P.ma20, col:'c2', fmt:FMT.d2, w:1},
     {k:'ma60', name:'60 日', kind:'line', arr:P.ma60, col:'c3', fmt:FMT.d2, w:1},
     {k:'ma240', name:'240 日', kind:'line', arr:P.ma240, col:'c4', fmt:FMT.d2, w:1},
     {k:'amt', name:'成交金額（億元）', kind:'vol', arr:P.amt, fmt:FMT.int}
   ]},
  {id:'inst', n:'2', title:'三大法人現貨買賣超（上市、上櫃）', unit:'億元', overlay:false, multi:true, cum:true,
   head:{arr:I.f, fmt:FMT.sgn(FMT.int), unit:'億元', name:'外資', delta:'sum20', dfmt:FMT.sgn(FMT.int), dlabel:'近 20 日合計'},
   hint:'紅柱是買超、綠柱是賣超，單位為億元，看左軸。每張圖另有一條「累計（自畫面起點）」線，看右軸（手機版右軸收起，數字看圖上方讀數）：從目前畫面最左邊那一天開始逐日加總、起點歸零，所以切換區間、拖曳或縮放後會重新累計，選「1 年」看到的就是近 1 年累計。三者之中外資的量體最大；連續多日同方向才算趨勢，單日的大買大賣常和指數調整、期貨結算有關。投信、自營商另有各自的節奏，分開畫在下面。最下面三張是上櫃市場（櫃買中心）的同樣三個法人：上櫃投信與自營商自 2017-01-03 起有資料，外資自 2018-01-15 起（官方在這之前沒有外資列）；上市、上櫃是兩個市場，金額分開看，不要直接相加。',

/* ---------------- 繪圖 ---------------- */
function mkData(def, T){
  var n = CAL.length, out = new Array(n), i;
  if(def.kind==='candle'){
    for(i=0;i<n;i++) out[i] = def.arr[i]==null ? {time:CAL[i]} : {time:CAL[i],open:def.o[i],high:def.h[i],low:def.l[i],close:def.arr[i]};
  } else if(def.kind==='hist' && def.sign){
    for(i=0;i<n;i++){ var v=def.arr[i]; out[i] = v==null ? {time:CAL[i]} : {time:CAL[i],value:v,color:v>=0?T.up:T.down}; }
  } else if(def.kind==='vol'){
    for(i=0;i<n;i++){ var u=def.arr[i]; out[i] = u==null ? {time:CAL[i]} : {time:CAL[i],value:u,color:(css('--idx')+'66')}; }
  } else if(def.sparse){
    out = [];       // 每週一點的序列：只放有值的點，讓線連起來；時間軸由 makeChart 的空白序列撐滿全部交易日
    for(i=0;i<n;i++){ if(def.arr[i]!=null) out.push({time:CAL[i],value:def.arr[i]}); }
  } else {
    for(i=0;i<n;i++) out[i] = def.arr[i]==null ? {time:CAL[i]} : {time:CAL[i],value:def.arr[i]};
  }
  return out;
}
function pf(def){
  var p = def.fmt && def.fmt.p!=null ? def.fmt.p : 2;
  return {type:'price', precision:p, minMove:Math.pow(10,-p)};
}
function narrow(){ return window.innerWidth < 640; }
function baseOptions(T, h, width){
  var nr = narrow();
  return {
    width:width, height:h,
    layout:{background:{type:'solid',color:T.bg}, textColor:T.text, fontFamily:"'Inter','Noto Sans TC',sans-serif", fontSize:nr?10:11},
    grid:{vertLines:{color:T.grid}, horzLines:{color:T.grid}},
    // 左右軸寬固定（取比最長標籤略大的值），所有圖的時間軸才會逐像素對齊
    leftPriceScale:{visible:true, minimumWidth:nr?70:80, borderColor:T.border, scaleMargins:{top:0.08,bottom:0.08}},
    rightPriceScale:{visible:!nr, minimumWidth:66, borderColor:T.border, scaleMargins:{top:0.08,bottom:0.08}},
    timeScale:{borderColor:T.border, rightOffset:2, minBarSpacing:0.04, fixLeftEdge:true, timeVisible:false},
    crosshair:{mode:0, vertLine:{labelVisible:true}, horzLine:{labelVisible:true}},
    localization:{locale:'zh-TW'},
    handleScale:{axisPressedMouseMove:{time:true, price:true}},
    kineticScroll:{touch:true, mouse:false}
  };
}

/* 資料起點晚於圖的最左邊（少於 10 年）的序列：在第一個資料點上標「資料起點 日期」，圖例也註明 */
function markStarts(item){
  var T = theme(), done = {};
  item.series.forEach(function(s){
    if(!s.start) return;
    var txt = done[s.start] ? '' : '資料起點 '+s.start;
    done[s.start] = true;
    s.api.setMarkers([{time:s.start, position:'aboveBar', color:T.ref, shape:'arrowDown', text:txt}]);
  });
}
function makeChart(parent, h, title, defs, ov, sectionOverlayOn){
  var T = theme();
  var box = document.createElement('div'); box.className='cbox'; parent.appendChild(box);
  if(title){ var st=document.createElement('div'); st.className='sub-title'; st.textContent=title; box.parentNode.insertBefore(st, box); }
  var ro = document.createElement('div'); ro.className='readout'; box.appendChild(ro);
  var chart = LWC.createChart(box, baseOptions(T, h, box.clientWidth||300));
  var item = {chart:chart, box:box, readout:ro, series:[], overlay:null, defs:defs};
  defs.forEach(function(def){
    var api, opt;
    var col = def.col ? T[def.col] : null;
    if(def.kind==='candle'){
      api = chart.addCandlestickSeries({priceScaleId:'left', upColor:T.up, downColor:T.down, borderUpColor:T.up, borderDownColor:T.down,
        wickUpColor:T.up, wickDownColor:T.down, priceLineVisible:false, lastValueVisible:true, priceFormat:pf(def)});
      chart.priceScale('left').applyOptions({scaleMargins:{top:0.06,bottom:0.26}});
    } else if(def.kind==='vol'){
      api = chart.addHistogramSeries({priceScaleId:'right', priceFormat:{type:'volume'}, priceLineVisible:false, lastValueVisible:false});
      chart.priceScale('right').applyOptions({scaleMargins:{top:0.78,bottom:0}});
    } else if(def.kind==='hist'){
      api = chart.addHistogramSeries({priceScaleId:'left', priceFormat:pf(def), priceLineVisible:false, lastValueVisible:false, color:col||T.c1});
    } else {
      api = chart.addLineSeries({priceScaleId:def.axis||'left', color:col, lineWidth:def.w||2, priceLineVisible:false, lastValueVisible:false,
        crosshairMarkerVisible:true, priceFormat:pf(def)});
    }
    api.setData(mkData(def, T));
    if(def.zero) api.createPriceLine({price:0, color:T.ref, lineWidth:1, lineStyle:2, axisLabelVisible:false});
    if(def.ref!=null) api.createPriceLine({price:def.ref, color:T.ref, lineWidth:1, lineStyle:2, axisLabelVisible:true, title:''});
    var fi = def.cumOf || def.kind==='vol' ? -1 : firstIdx(def.arr);
    item.series.push({def:def, api:api, visible:true, start:(fi>5 ? CAL[fi] : null)});
  });
  markStarts(item);
  if(defs.some(function(d){ return d.sparse; })){
    var pad = chart.addLineSeries({priceScaleId:'left', priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
    pad.setData(CAL.map(function(d){ return {time:d}; }));
  }
  if(ov){
    var line = chart.addLineSeries({priceScaleId:'right', color:T.idx, lineWidth:1, lineStyle:0, priceLineVisible:false,
      lastValueVisible:false, crosshairMarkerVisible:false, visible:!!sectionOverlayOn, priceFormat:{type:'price',precision:0,minMove:1}});
    line.setData(D.price.c.map(function(v,i){ return v==null?{time:CAL[i]}:{time:CAL[i],value:v}; }));
    item.overlay = line;
    if(!item.series.some(function(s){return s.def.kind==='vol';}))
      chart.priceScale('right').applyOptions({scaleMargins:{top:0.08,bottom:0.08}});
  }
  wireSync(item);
  if(typeof ResizeObserver!=='undefined'){
    new ResizeObserver(function(){ var w=box.clientWidth; if(w>0) chart.applyOptions({width:w}); }).observe(box);
  }
  charts.push(item);
  return item;
}

/* 累計（自畫面起點）：以目前畫面最左邊那一天為起點逐日加總，起點之前不畫；區間、拖曳、縮放後重算 */
var cumStart = -1, cumEnd = -1, cumTimer = 0;
function scheduleCum(){
  if(cumTimer) return;
  cumTimer = requestAnimationFrame(function(){ cumTimer = 0; recomputeCum(false); });
}
function recomputeCum(force){
  if(!charts.length) return;
  var r = charts[0].chart.timeScale().getVisibleLogicalRange();
  if(!r) return;
  var n = CAL.length, start = Math.max(0, Math.min(n-1, Math.ceil(r.from)));
  var end = Math.max(start, Math.min(n-1, Math.floor(r.to)));      // 畫面最右邊那一天（小卡顯示到這天的累計）
  if(!force && start===cumStart && end===cumEnd) return;
  cumStart = start; cumEnd = end;
  var T = theme(), tot = {};
  charts.forEach(function(o){
    o.series.forEach(function(s){
      var d = s.def;
      if(!d.cumOf) return;
      var out = new Array(n), acc = 0;
      for(var i=0;i<n;i++){
        if(i<start){ out[i]=null; continue; }
        var v = d.cumOf[i];
        if(v!=null) acc += v;
        out[i] = v==null ? null : Math.round(acc*100)/100;
        if(i===end) tot[d.k] = acc;
      }
      d.arr = out;
      s.api.setData(mkData(d, T));
    });
  });
  var el = document.querySelector('#s-inst .cumhd');
  if(el){
    var f = FMT.sgn(FMT.int);
    el.innerHTML = '畫面期間累計（'+CAL[start]+' 至 '+CAL[end]+'）：上市外資 '+f(Math.round(tot.f_c))+'、投信 '+f(Math.round(tot.t_c))+'、自營商 '+f(Math.round(tot.dl_c))+'；上櫃外資 '+f(Math.round(tot.of_c||0))+'、投信 '+f(Math.round(tot.ot_c||0))+'、自營商 '+f(Math.round(tot.odl_c||0))+' 億元';
  }
  var cc = document.getElementById('cardCum');
  if(cc) cc.textContent = FMT.sgn(FMT.int)(Math.round(tot.f_c));
  readouts(null);
}
function wireSync(item){
  item.chart.timeScale().subscribeVisibleLogicalRangeChange(function(r){
    scheduleCum();
    if(syncing || !r) return;
    syncing = true;
    charts.forEach(function(o){ if(o!==item) o.chart.timeScale().setVisibleLogicalRange(r); });
    syncing = false;
  });
  item.chart.subscribeCrosshairMove(function(p){
    if(syncing) return;
    syncing = true;
    if(!p || !p.time){
      charts.forEach(function(o){ o.chart.clearCrosshairPosition(); });
      readouts(null);
    } else {
      var i = CAL_IDX[p.time];
      charts.forEach(function(o){
        if(o===item) return;
        var s = o.series[0], arr = s.def.arr, v = arr[i];
        if(v==null){ var j=lastIdx(arr.slice(0,i+1)); v = j>=0?arr[j]:0; }
        o.chart.setCrosshairPosition(v, p.time, s.api);
      });
      readouts(i);
    }
    syncing = false;
  });
}

function readouts(i){
  charts.forEach(function(o){
    var idx = i;
    if(idx==null){ idx = -1; o.series.forEach(function(s){ var li=lastIdx(s.def.arr); if(li>idx) idx=li; }); }
    var html = '<b>'+CAL[idx]+'</b>';
    o.series.forEach(function(s){
      if(!s.visible) return;
      var d = s.def, T = theme();
      var col = d.kind==='candle' ? T.up : d.kind==='vol' ? T.idx : d.sign ? T.up : T[d.col];
      var v = d.arr[idx], tail = '';
      if(d.sparse && v==null){ var jj = lastIdx(d.arr.slice(0, idx+1)); if(jj>=0){ v = d.arr[jj]; tail = '（'+CAL[jj].slice(5)+'）'; } }
      var txt = d.kind==='candle' ? (v==null?'—': '開'+FMT.d2(d.o[idx])+' 高'+FMT.d2(d.h[idx])+' 低'+FMT.d2(d.l[idx])+' 收'+FMT.d2(v)) : d.fmt(v)+tail;
      html += '<i style="background:'+col+'"></i>'+d.name+' '+txt+'&ensp;';
    });
    if(o.overlay && o.overlay.options().visible){
      var cv = D.price.c[idx];
      html += '<i style="background:'+theme().idx+'"></i>加權指數 '+FMT.d2(cv)+'&ensp;';
    }
    o.readout.innerHTML = html;
  });
}

/* ---------------- 區段（標題列、說明、圖） ---------------- */
function buildSection(spec){
  var root = document.getElementById('charts');
  var sec = document.createElement('section'); sec.className='sec'; sec.id='s-'+spec.id; root.appendChild(sec);
  var head = document.createElement('div'); head.className='sec-head'; sec.appendChild(head);
  head.innerHTML = '<span class="n">'+spec.n+'</span><h2>'+spec.title+'</h2><span class="latest"></span><span class="chg"></span>'+(spec.cum?'<span class="chg cumhd"></span>':'');
  var tools = document.createElement('div'); tools.className='tools'; head.appendChild(tools);
  var who = 'f';
  var sel = null, ovOn = false, cbx = null;
  if(spec.who){
    sel = document.createElement('select');
    sel.innerHTML = '<option value="f">外資</option><option value="t">投信</option><option value="dl">自營商</option>';
    tools.appendChild(sel);
  }
  if(spec.overlay){
    var lab = document.createElement('label'); lab.innerHTML='<input type="checkbox"> 疊加加權指數（右軸）';
    cbx = lab.firstChild; tools.appendChild(lab);
  }
  var hint = document.createElement('p'); hint.className='hint'; hint.textContent = spec.hint; sec.appendChild(hint);
  var legend = document.createElement('div'); legend.className='legend'; sec.appendChild(legend);

  var wrap = document.createElement('div'); sec.appendChild(wrap);
  var items = [];
  var subs = spec.subs || [{h:spec.height, title:null, series:spec.series}];
  subs.forEach(function(sub){
    var defs = sub.series.map(function(d){ return Object.assign({}, d); });
    if(spec.who) defs.forEach(function(d){ d.arr = D.opt[d.optKey.replace('{w}', who)]; });
    var it = makeChart(wrap, sub.h, sub.title, defs, spec.overlay, false);
    it.vol = !!spec.volume;
    items.push(it);
  });

  // 圖例（可點擊顯示／隱藏序列）
  items.forEach(function(it){
    it.series.forEach(function(s){
      var chip = document.createElement('span'); chip.className='chip';
      var T = theme();
      var col = s.def.kind==='candle' ? T.up : s.def.kind==='vol' ? T.idx : s.def.sign ? T.up : T[s.def.col];
      chip.innerHTML = '<i style="background:'+col+'"></i>'+s.def.name+(s.start ? '（自 '+s.start+' 起）' : '');
      chip.addEventListener('click', function(){
        s.visible = !s.visible; s.api.applyOptions({visible:s.visible});
        chip.classList.toggle('off', !s.visible); readouts(null);
      });
      legend.appendChild(chip);
    });
  });
  if(spec.id==='fut'||spec.id==='large') {}
  if(cbx) cbx.addEventListener('change', function(){
    items.forEach(function(it){ it.overlay.applyOptions({visible:cbx.checked}); it.chart.applyOptions({rightPriceScale:{visible:cbx.checked || !narrow()}}); });
    readouts(null);
  });
  if(sel) sel.addEventListener('change', function(){
    who = sel.value;
    items.forEach(function(it){
      it.series.forEach(function(s){
        s.def.arr = D.opt[s.def.optKey.replace('{w}', who)];
        s.api.setData(mkData(s.def, theme()));
      });
    });
    headline(spec, sec, who);
    readouts(null);
  });
  headline(spec, sec, who);
  spec._items = items;
}

function headline(spec, sec, who){
  var h = spec.head, arr = h.arr || h.arrFn(who);
  var i = lastIdx(arr);
  var latestEl = sec.querySelector('.latest'), chgEl = sec.querySelector('.chg');
  if(i<0){ latestEl.textContent='—'; chgEl.textContent=''; return; }
  var name = h.name || '';
  if(spec.who) name = ({f:'外資',t:'投信',dl:'自營商'})[who] + '買權淨口數';
  var ex = h.extra ? h.extra(i) : '';
  latestEl.innerHTML = name+' '+h.fmt(arr[i])+' '+(h.unit||'')+ex+' <small>'+CAL[i]+'</small>';
  var txt = '';
  if(h.delta==='sum20'){
    var s = sumLast(arr, i, 20);
    txt = s==null ? '' : (h.dlabel||'近 20 日合計')+' '+h.dfmt(s)+' '+(h.unit||'');
  } else if(h.delta==='prev4'){         // 每週一點的序列：和 4 個週點之前（約 4 週）比
    var ks = [], q;
    for(q=0;q<=i;q++){ if(arr[q]!=null) ks.push(q); }
    var p4 = ks.length>4 ? arr[ks[ks.length-5]] : null;
    txt = p4==null ? '' : '較 4 週前 '+h.dfmt(arr[i]-p4)+' '+(h.dunit||h.unit||'');
  } else {
    var pv = valBack(arr, i, 20);
    txt = pv==null ? '' : '較 20 日前 '+h.dfmt(arr[i]-pv)+' '+(h.dunit||h.unit||'');
  }
  chgEl.innerHTML = txt;
}

/* ---------------- 小卡 ---------------- */
function card(k, v, s, d, cls){

}
function cls(v){ return v>0?'up':v<0?'dn':''; }
function buildCards(){

  var iff = lastIdx(F.f);

  h += card('外資期貨淨口數（口）', iff<0?'—':FMT.sgn(FMT.int)(F.f[iff]), fchg==null?'':'較前一日 '+FMT.sgn(FMT.int)(fchg), iff<0?'—':CAL[iff], iff<0?'':cls(F.f[iff]));
  var ir = lastIdx(R.or);
  h += card('選擇權 P/C Ratio', ir<0?'—':FMT.d1(R.or[ir])+'%', ir<0?'':'成交量比 '+FMT.d1(R.vr[ir])+'%', ir<0?'—':CAL[ir]+'（未平倉比）', '');
  document.getElementById('cards').innerHTML = h;
}

/* ---------------- 區間 ---------------- */
function setRange(months){
  curMonths = months;
  var n = CAL.length, from = 0;
  if(months>0){
    var last = new Date(CAL[n-1]+'T00:00:00Z');
    last.setUTCMonth(last.getUTCMonth()-months);
    var tgt = last.toISOString().slice(0,10);
    from = 0;
    for(var i=0;i<n;i++){ if(CAL[i]>=tgt){ from=i; break; } }
  }
  var r = {from:from-0.5, to:n-1+2};
  syncing = true;
  charts.forEach(function(o){ o.chart.timeScale().setVisibleLogicalRange(r); });
  syncing = false;
  [].forEach.call(document.querySelectorAll('#rng button'), function(b){ b.classList.toggle('on', +b.dataset.m===months); });
  recomputeCum(true);
}

/* ---------------- 籌碼能不能預測未來 3 個月（已檢定，靜態結果） ---------------- */
function buildForecast(F){
  var el = document.getElementById('forecast');

  var byId = {}; F.indicators.forEach(function(x){ byId[x.id] = x; });

  var pb = function(v){ return (Math.abs(v)*100).toFixed(1); };
  var indep = F.indicators.filter(function(x){ return !x.insufficient; }).reduce(function(a,x){ return a.concat([x.n_indep_high, x.n_indep_low]); }, []);
  var lo = Math.round(Math.min.apply(null, indep)), hi = Math.round(Math.max.apply(null, indep));
  var rows = F.indicators.map(function(x){
    var good = x.d===1 ? '高組' : '低組';

    return '<tr><td>'+x.name_zh+'</td><td>'+good+'</td><td class="num">'+pp(x.S_build_good)+'</td><td class="num">'+pp(x.S_test)+'</td><td class="num">'+pcell+'</td><td>'+(x.insufficient?'樣本不足，不判定':'不通過')+'</td></tr>';
  }).join('');
  var B = byId.B, A = byId.A, Fi = byId.F;
  var thrB = (B.holm_threshold*100).toFixed(2).replace(/0$/,'');
  el.innerHTML =
    '<div class="sec-head"><span class="n">14</span><h2>籌碼能不能預測未來 3 個月？（已檢定）</h2></div>'+
    '<p class="lead"><b>'+(F.indicators.length===6?'六':F.indicators.length)+'個指標都沒有通過事先登記的判準，不要拿這些籌碼猜漲跌。</b></p>'+
    '<p>測法：每天把指標放進過去三年的排名，排在最高 20% 的日子歸高組，最低 20% 歸低組，再比兩組之後 60 個交易日（約 3 個月）的加權指數報酬中位數。每個指標哪一端是好端，由 '+F.build[0]+' 至 '+F.build[1]+' 的資料決定，定下來就不再改。拿來檢驗的是設計規則時沒用過的 '+F.test_start+' 起的資料，最後一個走完 60 個交易日的訊號日是 '+F.last_r60_date+'。這段驗證期只約 '+Math.round(F.n_indep_est)+' 個不重疊的 60 日期間，除外資台指期淨未平倉比以外，高組和低組各約 '+lo+' 到 '+hi+' 段。規則與判準在看到任何結果之前就寫定（2026-10-17 事前登記）。</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>指標</th><th>好端（建立期決定）</th><th>建立期 好端減壞端</th><th>驗證期 好端減壞端</th><th>安慰劑 p 值</th><th>判定</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="note">組間差單位為個百分點，是好端組比壞端組之後 60 日報酬中位數多多少（取對數報酬）；建立期的差一定為正，因為好端就是照建立期的結果選出來的；驗證期為負，代表好端組反而比壞端組差。安慰劑 p 值是把指標序列在時間軸上隨機平移 '+F.n_placebo.toLocaleString('en-US')+' 次、每次重做一遍分組與方向選擇後，隨機序列做到一樣好或更好的比例。前五個指標同時檢定，所以過關門檻收緊到 0.0125 至 0.05；小台散戶多空比是另外登記的單一檢定，門檻 0.05。</p>'+
    '<p>融資餘額 60 日變化最接近過關：融資餘額增加快的日子，之後 60 日報酬中位數比增加慢的日子高 '+pb(B.S_test)+' 個百分點。但隨機序列有 '+(B.p_placebo*100).toFixed(1)+'% 做到一樣好或更好，過關要低於 '+thrB+'%。另外融資餘額高的 '+B.n_high_w52on+' 個交易日全都在 W52（週收盤高於 52 週均線）之上，W52 之上的低組只有 '+B.n_low_w52on+' 個交易日，看不出它在 W52 之外還有沒有多出來的資訊。外資現貨 60 日淨買占成交比、賣權買權未平倉比、大額交易人前十大淨部位比三個指標，驗證期的結果與建立期相反：原本當作壞端的高組，之後 60 日報酬反而較高。外資台指期淨未平倉比在驗證期只有 '+A.n_high+' 個交易日落在高組，樣本不足，不判定。</p>'+
    (Fi ? '<p>小台散戶多空比（三大法人以外的小台部位偏多或偏空）：散戶偏空的日子，之後 60 日報酬中位數比散戶偏多的日子高 '+pb(Fi.S_test)+' 個百分點，方向和建立期一致，在 W52 之上也還有 '+pb(Fi.S_w52)+' 個百分點。但隨機序列有 '+(Fi.p_placebo*100).toFixed(1)+'% 做到一樣好或更好，過關要低於 5%；若和前五個指標合在一起校正，門檻是 '+(Fi.holm6_threshold*100).toFixed(0)+'%。另外建立期裡散戶偏空的日子很少，方向主要由 2019 與 2020 年下半年兩小段決定。</p>' : '')+
    '<p>這不代表籌碼沒有用，只代表用這'+(F.indicators.length===6?'六':'五')+'個指標、看 60 個交易日、在十年資料上，分不出來。獨立樣本只有約 '+Math.round(F.n_indep_est)+' 段，只有很強的訊號才看得見。上面各圖說的是現在的狀態，不是未來。</p>'+
    '<p class="note">事前登記在研究倉庫 v7-backtest 的 docs/TW_Chips_Forecast_Prereg.md，完整結果在 results/tw_chips_forecast/（summary.json、forecast.json、report.md）。頁面層零個指標通過，所以沒有做引擎疊加。小台散戶多空比另有補充登記 docs/TW_Chips_Forecast_Prereg_F.md（小台資料進庫前寫定），結果在 docs/TW_Chips_Forecast_Results_F.md。期貨正逆價差、台指 VIX、當沖比率與上櫃籌碼不在檢定內；要測須另開事前登記，並把這六次檢定計入多重比較。</p>';
  el.hidden = false;
  window.__forecastReady = true;
}

/* ---------------- 頁尾 ---------------- */
function buildSource(){
  var m = D.meta;
  var rows = m.series.map(function(s){
    return '<tr><td>'+s.label+'</td><td>'+s.source+'</td><td class="num">'+(s.first||'—')+'</td><td class="num">'+(s.last||'—')+'</td><td class="num">'+s.n.toLocaleString('en-US')+'</td><td class="num">'+s.gaps+'</td></tr>';
  }).join('');
  document.getElementById('src').innerHTML =
    '<h2>資料來源與涵蓋期間</h2><div class="tbl-wrap"><table><thead><tr><th>序列</th><th>來源</th><th>最早日</th><th>最新日</th><th>筆數</th><th>缺漏日</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="fine">資料每個交易日晚間自動更新，最近一次建檔時間：'+m.updated+'（台北）。'+
    '現貨三大法人、融資融券、指數與成交金額取自證交所；期貨、選擇權、Put/Call Ratio、大額交易人取自期交所；匯率取自 FRED（聖路易聯邦準備銀行，日資料，約晚一週更新，美國休市日圖上沿用前一營業日）。<br>'+
    '期交所網站只開放近 3 年的三大法人期貨與選擇權日資料，2018-06-05 至 2023-10-17 的部分取自 FinMind 轉載的同一份期交所資料（2023-10 起與期交所原表逐筆核對一致）；2018-06 之前沒有可取得的來源，圖上留白，不補數字。<br>'+
    '借券：上市借券餘額的金額直接取自證交所「借券餘額表」（TWT72U）的官方彙總；證交所只公布借券賣出餘額的股數（TWT93U），金額是各股借券賣出餘額股數乘當日收盤價（取自同日 TWT72U）加總。上市總市值取自證交所「市值週報」，官方只有每週最後一個交易日的數字（2005-09 起、週報為初步估計），所以占比只在週末日計算，圖上每週一點，沒有拿前一週的市值去除逐日金額。<br>'+
    '小型／微型臺指期貨：三大法人未平倉口數取自期交所「三大法人－區分各期貨契約」（futContractsDateDown，MXF／TMF），全市場未平倉口數取自期交所「期貨每日交易行情」（dlFutDataDown）一般交易時段所有月份（含週契約）、不含跨月價差單的合計。正逆價差同樣用這份行情的近月契約收盤價減加權指數收盤。台指 VIX 取自期交所波動率指數月檔，官網只保留最近約 4 個月，起點是我們開始抓的 2026-07-01。<br>'+
    '當沖比率取自證交所「當日沖銷交易統計資訊」（TWTB4U），比重為證交所官方計算，分母含一般、盤後定價、零股與鉅額成交。上櫃三大法人與融資融券取自櫃買中心的官方彙總表（insti/summary、margin/balance），融資融券直接取表尾合計列，沒有逐檔加總；上櫃三大法人 2017-01-03 之前整天沒有資料，2017-01-03 至 2018-01-12 官方只列投信與自營商，外資自 2018-01-15 起，圖上留白不補。<br>'+
    '融資融券依證交所註明「以前日餘額為準」，每個交易日的餘額以隔日公布的前日餘額為準；最新一日暫用當日餘額。融券官方只公布張數，沒有金額。<br>'+
    '加權指數資料的缺漏日是證交所該月沒有提供當日資料的日子，沒有任何一天是補出來的。圖表使用 TradingView Lightweight Charts。</p>';
  document.getElementById('asof').textContent = '指數資料至 '+m.cal_last+'・最近建檔 '+m.updated+'（台北）・所有圖自 '+m.cal_first+' 起';
}

/* ---------------- 主題切換 ---------------- */
function reTheme(){
  var T = theme();
  charts.forEach(function(o){
    o.chart.applyOptions({
      layout:{background:{type:'solid',color:T.bg}, textColor:T.text},
      grid:{vertLines:{color:T.grid}, horzLines:{color:T.grid}},
      leftPriceScale:{borderColor:T.border}, rightPriceScale:{borderColor:T.border}, timeScale:{borderColor:T.border}
    });
    o.series.forEach(function(s){
      var d = s.def;
      if(d.kind==='line') s.api.applyOptions({color:T[d.col]});
      else if(d.kind==='candle') s.api.applyOptions({upColor:T.up,downColor:T.down,borderUpColor:T.up,borderDownColor:T.down,wickUpColor:T.up,wickDownColor:T.down});
      if(d.kind==='hist' || d.kind==='vol' || d.kind==='candle') {
        if(d.kind!=='candle') s.api.setData(mkData(d, T));
      }
    });
    if(o.overlay) o.overlay.applyOptions({color:T.idx});
  });
  readouts(null);
}

/* ---------------- 啟動 ---------------- */
function load(name){
  return fetch('data/'+name+'.json?v='+V).then(function(r){ if(!r.ok) throw new Error(name+' '+r.status); return r.json(); });
}
function fixNavOffset(){
  var nav = document.querySelector('.imq-nav-root');
  if(nav) document.documentElement.style.setProperty('--nav-h', nav.offsetHeight+'px');
}

Promise.all(FILES.map(load)).then(function(res){
  FILES.forEach(function(f,i){ D[f] = res[i]; });
  CAL = D.cal.t; CAL.forEach(function(d,i){ CAL_IDX[d]=i; });
  fixNavOffset(); window.addEventListener('resize', fixNavOffset);
  buildCards();
  buildSpecs().forEach(buildSection);
  buildSource();
  [].forEach.call(document.querySelectorAll('#rng button'), function(b){
    b.addEventListener('click', function(){ setRange(+b.dataset.m); });
  });
  setRange(12);
  readouts(null);
  if(window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener.bind(mq,'change') : mq.addListener.bind(mq))(reTheme);
  }
  load('forecast').then(buildForecast).catch(function(e){ window.__forecastError = String(e.message||e); });
  window.__tw = {charts:charts, CAL:CAL};
  window.__chipsReady = true;
}).catch(function(e){
  document.getElementById('charts').innerHTML = '<div class="err">資料載入失敗：'+String(e.message||e)+'。請稍後重新整理。</div>';
  window.__chipsError = String(e.message||e);
});
})();
</script>
