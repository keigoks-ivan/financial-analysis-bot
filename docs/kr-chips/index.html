*{box-sizing:border-box;min-width:0}
html,body{max-width:100%;overflow-x:hidden}

<script>
(function(){
'use strict';
var LWC = window.LightweightCharts;
var V = String(Date.now()).slice(0,8);   // 資料檔快取：每約 11 天自然換一次，另由 meta.updated 補強
var FILES = ['cal','kospi','kosdaq','inst','deposit','credit','lend','fx','meta'];
var D = {}, CAL = [], CAL_IDX = {};
var charts = [];            // 所有圖：{chart, box, readout, series:[{def,api}], overlay, cum, ...}
var syncing = false;
var curMonths = 12;

function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function theme(){
  return {bg:css('--card'), text:css('--body'), grid:css('--line-soft'), border:css('--line'),
    up:css('--up'), down:css('--down'), c1:css('--c1'), c2:css('--c2'), c3:css('--c3'), c4:css('--c4'),
    idx:css('--idx'), ref:css('--muted'), ban:css('--ban')};
}
var FMT = {
  int:function(v){ return v==null?'—':Math.round(v).toLocaleString('en-US'); },
  d1:function(v){ return v==null?'—':v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}); },
  d2:function(v){ return v==null?'—':v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); },
  d3:function(v){ return v==null?'—':v.toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}); },
  sgn:function(f){ var g=function(v){ return v==null?'—':(v>0?'+':'')+f(v); }; g.p=f.p; return g; },
  zh:function(v){ return v==null?'—':(v/10000).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }   // 億韓元 → 兆韓元
};
FMT.int.p=0; FMT.d1.p=1; FMT.d2.p=2; FMT.d3.p=3;
function lastIdx(arr){ for(var i=arr.length-1;i>=0;i--){ if(arr[i]!=null) return i; } return -1; }
function valBack(arr, i, n){            // i 往前 n 個交易日；該日沒值就往前找最多 5 天
  var j = i - n;
  for(var k=0;k<=5 && j-k>=0;k++){ if(arr[j-k]!=null) return arr[j-k]; }
  return null;
}
function sumLast(arr, i, n){ var s=0; for(var k=0;k<n;k++){ var v=arr[i-k]; if(v==null) return null; s+=v; } return s; }
// 自 from 起逐日累計；缺值日該點為 null，之後接續累計
function cumFrom(arr, from){
  var out = new Array(arr.length), tot = 0;
  for(var i=0;i<arr.length;i++){
    if(i<from){ out[i]=null; continue; }
    var v = arr[i];
    if(v==null){ out[i]=null; continue; }
    tot += v; out[i] = Math.round(tot*100)/100;
  }
  return out;
}

/* ---------------- 圖表定義 ---------------- */
// kind: line | hist | candle | vol；col: 主題色 key；sign: 柱狀圖依正負上色（紅買超／藍賣超）
function priceSpec(id, n, title, M, hint){
  return {id:id, n:n, title:title, height:380, overlay:false, volume:true,
   head:{arr:M.c, fmt:FMT.d2, unit:'點', delta:'diff', dfmt:FMT.sgn(FMT.d2)},
   hint:hint,
   series:[
     {k:'c', name:title.split(' ')[0], kind:'candle', o:M.o, h:M.h, l:M.l, arr:M.c, fmt:FMT.d2},
     {k:'ma20', name:'20 日', kind:'line', arr:M.ma20, col:'c2', fmt:FMT.d2, w:1},
     {k:'ma60', name:'60 日', kind:'line', arr:M.ma60, col:'c3', fmt:FMT.d2, w:1},
     {k:'ma240', name:'240 日', kind:'line', arr:M.ma240, col:'c4', fmt:FMT.d2, w:1},
     {k:'amt', name:'成交金額（億韓元）', kind:'vol', arr:M.amt, fmt:FMT.int}
   ]};
}
function flowSpec(id, n, mk, title, pre, M, hint){
  var I = D.inst, S = FMT.sgn(FMT.int);
  return {id:id, n:n, title:title, unit:'億韓元', overlay:true, multi:true, cum:true, ovKey:mk,
   head:{arr:I[pre+'f'], fmt:S, unit:'億韓元', name:'外國人', delta:'sum20', dfmt:S, dlabel:'近 20 日合計'},

function ovArr(key){ return key==='kosdaq' ? D.kosdaq.c : D.kospi.c; }

/* ---------------- 繪圖 ---------------- */
function mkData(def, T){
  var n = CAL.length, out = new Array(n), i;
  if(def.kind==='candle'){
    for(i=0;i<n;i++) out[i] = def.arr[i]==null ? {time:CAL[i]} : {time:CAL[i],open:def.o[i],high:def.h[i],low:def.l[i],close:def.arr[i]};
  } else if(def.kind==='hist' && def.sign){
    for(i=0;i<n;i++){ var v=def.arr[i]; out[i] = v==null ? {time:CAL[i]} : {time:CAL[i],value:v,color:v>=0?T.up:T.down}; }
  } else if(def.kind==='vol'){
    for(i=0;i<n;i++){ var u=def.arr[i]; out[i] = u==null ? {time:CAL[i]} : {time:CAL[i],value:u,color:(css('--idx')+'66')}; }
  } else {
    for(i=0;i<n;i++) out[i] = def.arr[i]==null ? {time:CAL[i]} : {time:CAL[i],value:def.arr[i]};
  }
  return out;
}
function pf(def){
  var p = def.fmt && def.fmt.p!=null ? def.fmt.p : 2;
  return {type:'price', precision:p, minMove:Math.pow(10,-p)};
}
function narrow(){ return window.innerWidth < 640; }
function baseOptions(T, h, width){
  var nr = narrow();
  return {
    width:width, height:h,
    layout:{background:{type:'solid',color:T.bg}, textColor:T.text, fontFamily:"'Inter','Noto Sans TC',sans-serif", fontSize:nr?10:11},
    grid:{vertLines:{color:T.grid}, horzLines:{color:T.grid}},
    // 左右軸寬固定（取比最長標籤略大的值），所有圖的時間軸才會逐像素對齊
    leftPriceScale:{visible:true, minimumWidth:nr?70:80, borderColor:T.border, scaleMargins:{top:0.08,bottom:0.08}},
    rightPriceScale:{visible:!nr, minimumWidth:66, borderColor:T.border, scaleMargins:{top:0.08,bottom:0.08}},
    timeScale:{borderColor:T.border, rightOffset:2, minBarSpacing:0.04, fixLeftEdge:true, timeVisible:false},
    crosshair:{mode:0, vertLine:{labelVisible:true}, horzLine:{labelVisible:true}},
    localization:{locale:'zh-TW'},
    handleScale:{axisPressedMouseMove:{time:true, price:true}},
    kineticScroll:{touch:true, mouse:false}
  };
}

// opts: {ov:是否加指數疊加線, ovKey, cumDef:累計線定義, ban:是否畫禁空底色}
function makeChart(parent, h, title, defs, opts){
  var T = theme();
  var box = document.createElement('div'); box.className='cbox'; parent.appendChild(box);
  if(title){ var st=document.createElement('div'); st.className='sub-title'; st.textContent=title; box.parentNode.insertBefore(st, box); }
  var ro = document.createElement('div'); ro.className='readout'; box.appendChild(ro);
  var chart = LWC.createChart(box, baseOptions(T, h, box.clientWidth||300));
  var item = {chart:chart, box:box, readout:ro, series:[], overlay:null, cum:null, ovKey:opts.ovKey, defs:defs};
  if(opts.ban){
    var band = chart.addHistogramSeries({priceScaleId:'ban', priceLineVisible:false, lastValueVisible:false, priceFormat:{type:'price',precision:0,minMove:1}});
    chart.priceScale('ban').applyOptions({scaleMargins:{top:0,bottom:0}, visible:false});
    band.setData(CAL.map(function(d,i){ return D.cal.ban[i] ? {time:d,value:1,color:T.ban} : {time:d}; }));
    item.band = band;
  }
  defs.forEach(function(def){
    var api;
    var col = def.col ? T[def.col] : null;
    if(def.kind==='candle'){
      api = chart.addCandlestickSeries({priceScaleId:'left', upColor:T.up, downColor:T.down, borderUpColor:T.up, borderDownColor:T.down,
        wickUpColor:T.up, wickDownColor:T.down, priceLineVisible:false, lastValueVisible:true, priceFormat:pf(def)});
      chart.priceScale('left').applyOptions({scaleMargins:{top:0.06,bottom:0.26}});
    } else if(def.kind==='vol'){
      api = chart.addHistogramSeries({priceScaleId:'right', priceFormat:{type:'volume'}, priceLineVisible:false, lastValueVisible:false});
      chart.priceScale('right').applyOptions({scaleMargins:{top:0.78,bottom:0}});
    } else if(def.kind==='hist'){
      api = chart.addHistogramSeries({priceScaleId:'left', priceFormat:pf(def), priceLineVisible:false, lastValueVisible:false, color:col||T.c1});
    } else {
      api = chart.addLineSeries({priceScaleId:'left', color:col, lineWidth:def.w||2, priceLineVisible:false, lastValueVisible:false,
        crosshairMarkerVisible:true, priceFormat:pf(def)});
    }
    api.setData(mkData(def, T));
    if(def.zero) api.createPriceLine({price:0, color:T.ref, lineWidth:1, lineStyle:2, axisLabelVisible:false});
    item.series.push({def:def, api:api, visible:true});
  });
  if(opts.cumDef){
    // 累計線：畫在右軸（有刻度），數值隨可視範圍的最左邊那天重新起算
    var cd = Object.assign({}, opts.cumDef);
    var cl = chart.addLineSeries({priceScaleId:'right', color:T.c4, lineWidth:2, priceLineVisible:false,
      lastValueVisible:false, crosshairMarkerVisible:true, visible:false, priceFormat:{type:'price',precision:0,minMove:1}});
    cl.createPriceLine({price:0, color:T.ref, lineWidth:1, lineStyle:2, axisLabelVisible:false});
    item.cum = {def:cd, api:cl, src:opts.cumDef.src, visible:false};
  }
  if(opts.ov){
    // 有累計線時，指數疊加線改放隱藏刻度的獨立軸（只看形狀），避免和累計線共用右軸而失真
    var sid = opts.cumDef ? 'idx' : 'right';
    var line = chart.addLineSeries({priceScaleId:sid, color:T.idx, lineWidth:1, lineStyle:0, priceLineVisible:false,
      lastValueVisible:false, crosshairMarkerVisible:false, visible:false, priceFormat:{type:'price',precision:0,minMove:1}});
    var oa = ovArr(opts.ovKey);
    line.setData(oa.map(function(v,i){ return v==null?{time:CAL[i]}:{time:CAL[i],value:v}; }));
    item.overlay = line;
    if(opts.cumDef) chart.priceScale('idx').applyOptions({scaleMargins:{top:0.08,bottom:0.08}, visible:false});
    else if(!item.series.some(function(s){return s.def.kind==='vol';}))
      chart.priceScale('right').applyOptions({scaleMargins:{top:0.08,bottom:0.08}});
  }
  wireSync(item);
  if(typeof ResizeObserver!=='undefined'){
    new ResizeObserver(function(){ var w=box.clientWidth; if(w>0) chart.applyOptions({width:w}); }).observe(box);
  }
  charts.push(item);
  return item;
}

function wireSync(item){
  item.chart.timeScale().subscribeVisibleLogicalRangeChange(function(r){
    if(syncing || !r) return;
    syncing = true;
    charts.forEach(function(o){ if(o!==item) o.chart.timeScale().setVisibleLogicalRange(r); });
    syncing = false;
    scheduleCum();
  });
  item.chart.subscribeCrosshairMove(function(p){
    if(syncing) return;
    syncing = true;
    if(!p || !p.time){
      charts.forEach(function(o){ o.chart.clearCrosshairPosition(); });
      readouts(null);
    } else {
      var i = CAL_IDX[p.time];
      charts.forEach(function(o){
        if(o===item) return;
        var s = o.series[0], arr = s.def.arr, v = arr[i];
        if(v==null){ var j=lastIdx(arr.slice(0,i+1)); v = j>=0?arr[j]:0; }
        o.chart.setCrosshairPosition(v, p.time, s.api);
      });
      readouts(i);
    }
    syncing = false;
  });
}

/* ---- 累計（自畫面起點）：依目前可視範圍的最左邊那天重算 ---- */
var cumTimer = null;
function scheduleCum(){ if(cumTimer) clearTimeout(cumTimer); cumTimer = setTimeout(recomputeCum, 60); }
function recomputeCum(){
  cumTimer = null;
  var any = charts.filter(function(o){ return o.cum && o.cum.visible; });
  if(!any.length) return;
  var r = charts[0].chart.timeScale().getVisibleLogicalRange();
  var from = r ? Math.max(0, Math.ceil(r.from)) : 0;
  any.forEach(function(o){
    o.cum.def.arr = cumFrom(o.cum.src, from);
    o.cum.def.from = from;
    o.cum.api.setData(o.cum.def.arr.map(function(v,i){ return v==null?{time:CAL[i]}:{time:CAL[i],value:v}; }));
  });
  readouts(null);
}

function readouts(i){
  charts.forEach(function(o){
    var idx = i;
    if(idx==null){ idx = -1; o.series.forEach(function(s){ var li=lastIdx(s.def.arr); if(li>idx) idx=li; }); }
    var html = '<b>'+CAL[idx]+'</b>';
    var T = theme();
    o.series.forEach(function(s){
      if(!s.visible) return;
      var d = s.def;
      var col = d.kind==='candle' ? T.up : d.kind==='vol' ? T.idx : d.sign ? T.up : T[d.col];
      var v = d.arr[idx];
      var txt = d.kind==='candle' ? (v==null?'—': '開'+FMT.d2(d.o[idx])+' 高'+FMT.d2(d.h[idx])+' 低'+FMT.d2(d.l[idx])+' 收'+FMT.d2(v)) : d.fmt(v);
      html += '<i style="background:'+col+'"></i>'+d.name+' '+txt+'&ensp;';
    });
    if(o.cum && o.cum.visible && o.cum.def.arr){
      html += '<i style="background:'+T.c4+'"></i>累計（自 '+CAL[o.cum.def.from||0]+' 起） '+FMT.sgn(FMT.int)(o.cum.def.arr[idx])+'&ensp;';
    }
    if(o.overlay && o.overlay.options().visible){
      var cv = ovArr(o.ovKey)[idx];
      html += '<i style="background:'+T.idx+'"></i>'+ovName(o.ovKey)+' '+FMT.d2(cv)+'&ensp;';
    }
    o.readout.innerHTML = html;
  });
}

/* ---------------- 區段（標題列、說明、圖） ---------------- */
function buildSection(spec){
  var root = document.getElementById('charts');
  var sec = document.createElement('section'); sec.className='sec'; sec.id='s-'+spec.id; root.appendChild(sec);
  var head = document.createElement('div'); head.className='sec-head'; sec.appendChild(head);
  head.innerHTML = '<span class="n">'+spec.n+'</span><h2>'+spec.title+'</h2><span class="latest"></span><span class="chg"></span>';
  var tools = document.createElement('div'); tools.className='tools'; head.appendChild(tools);
  var cbx = null, cumBox = null;
  if(spec.cum){
    var lc = document.createElement('label'); lc.innerHTML='<input type="checkbox"> 疊加累計（自畫面起點，右軸）';
    cumBox = lc.firstChild; tools.appendChild(lc);
  }
  if(spec.overlay){
    var lab = document.createElement('label'); lab.innerHTML='<input type="checkbox"> 疊加'+ovName(spec.ovKey)+(spec.cum?'（無刻度，只看走勢）':'（右軸）');
    cbx = lab.firstChild; tools.appendChild(lab);
  }
  var hint = document.createElement('p'); hint.className='hint'; hint.textContent = spec.hint; sec.appendChild(hint);
  var legend = document.createElement('div'); legend.className='legend'; sec.appendChild(legend);

  var wrap = document.createElement('div'); sec.appendChild(wrap);
  var items = [];
  var subs = spec.subs || [{h:spec.height, title:null, series:spec.series}];
  subs.forEach(function(sub){
    var defs = sub.series.map(function(d){ return Object.assign({}, d); });
    var opts = {ov:spec.overlay, ovKey:spec.ovKey, ban:!!spec.ban};
    if(spec.cum) opts.cumDef = {k:'cum', name:'累計', kind:'line', arr:null, src:defs[0].arr};
    var it = makeChart(wrap, sub.h, sub.title, defs, opts);
    it.vol = !!spec.volume;
    items.push(it);
  });

  // 圖例（可點擊顯示／隱藏序列）
  items.forEach(function(it){
    it.series.forEach(function(s){
      var chip = document.createElement('span'); chip.className='chip';
      var T = theme();
      var col = s.def.kind==='candle' ? T.up : s.def.kind==='vol' ? T.idx : s.def.sign ? T.up : T[s.def.col];
      chip.innerHTML = '<i style="background:'+col+'"></i>'+s.def.name;
      chip.addEventListener('click', function(){
        s.visible = !s.visible; s.api.applyOptions({visible:s.visible});
        chip.classList.toggle('off', !s.visible); readouts(null);
      });
      legend.appendChild(chip);
    });
  });
  if(cbx) cbx.addEventListener('change', function(){
    items.forEach(function(it){
      it.overlay.applyOptions({visible:cbx.checked});
      if(!spec.cum) it.chart.applyOptions({rightPriceScale:{visible:cbx.checked || !narrow()}});
    });
    readouts(null);
  });
  if(cumBox) cumBox.addEventListener('change', function(){
    items.forEach(function(it){
      it.cum.visible = cumBox.checked;
      it.cum.api.applyOptions({visible:cumBox.checked});
      it.chart.applyOptions({rightPriceScale:{visible:cumBox.checked || !narrow()}});
    });
    recomputeCum(); readouts(null);
  });
  headline(spec, sec);
  spec._items = items;
}

function headline(spec, sec){
  var h = spec.head, arr = h.arr;
  var i = lastIdx(arr);
  var latestEl = sec.querySelector('.latest'), chgEl = sec.querySelector('.chg');
  if(i<0){ latestEl.textContent='—'; chgEl.textContent=''; return; }
  var ex = h.extra ? h.extra(i) : '';
  latestEl.innerHTML = (h.name||'')+' '+h.fmt(arr[i])+' '+(h.unit||'')+ex+' <small>'+CAL[i]+'</small>';
  var txt = '';
  if(h.delta==='sum20'){
    var s = sumLast(arr, i, 20);
    txt = s==null ? '' : (h.dlabel||'近 20 日合計')+' '+h.dfmt(s)+' '+(h.unit||'');
  } else {
    var pv = valBack(arr, i, 20);
    txt = pv==null ? '' : '較 20 日前 '+h.dfmt(arr[i]-pv)+' '+(h.unit||'');
  }
  chgEl.innerHTML = txt;
}

/* ---------------- 小卡 ---------------- */
function card(k, v, s, d, cls){
  return '<div class="card"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div><div class="s">'+(s||'&nbsp;')+'</div><div class="d">'+d+'</div></div>';
}
function cls(v){ return v>0?'up':v<0?'dn':''; }
function buildCards(){
  var K=D.kospi, I=D.inst, DP=D.deposit, C=D.credit, L=D.lend, h='';
  var ip = lastIdx(K.c);
  var pchg = ip>0 && K.c[ip-1]!=null ? K.c[ip]-K.c[ip-1] : null;
  h += card('KOSPI', FMT.d2(K.c[ip]), pchg==null?'':(pchg>0?'+':'')+FMT.d2(pchg)+'（'+(pchg>0?'+':'')+FMT.d2(pchg/K.c[ip-1]*100)+'%）', CAL[ip], cls(pchg));
  var ii = lastIdx(I.kf);
  h += card('KOSPI 外國人買賣超（億韓元）', ii<0?'—':FMT.sgn(FMT.int)(I.kf[ii]), ii<0?'':'近 20 日合計 '+FMT.sgn(FMT.int)(sumLast(I.kf, ii, 20)||0), ii<0?'—':CAL[ii], ii<0?'':cls(I.kf[ii]));
  var id = lastIdx(DP.dep);
  var dchg = id>0 && DP.dep[id-1]!=null ? DP.dep[id]-DP.dep[id-1] : null;
  h += card('投資人預託金（兆韓元）', id<0?'—':FMT.zh(DP.dep[id]), dchg==null?'':'較前一日 '+FMT.sgn(FMT.int)(dchg)+' 億', id<0?'—':CAL[id], dchg==null?'':cls(dchg));
  var ic = lastIdx(C.tot);
  var cchg = ic>0 && C.tot[ic-1]!=null ? C.tot[ic]-C.tot[ic-1] : null;
  h += card('信用融資餘額（兆韓元）', ic<0?'—':FMT.zh(C.tot[ic]), ic<0?'':'佔上市總市值 '+FMT.d2(C.r_tot[ic])+'%', ic<0?'—':CAL[ic], cchg==null?'':cls(cchg));
  var il = lastIdx(L.amt), ir = lastIdx(L.ratio);     // 佔比的分母（市值）晚一天公布，所以佔比的最新日可能比餘額早一天
  h += card('借券餘額（兆韓元）', il<0?'—':FMT.zh(L.amt[il]), ir<0?'':'佔上市總市值 '+FMT.d2(L.ratio[ir])+'%'+(ir!==il?'（'+CAL[ir].slice(5)+'）':''), il<0?'—':CAL[il], '');
  document.getElementById('cards').innerHTML = h;
}

/* ---------------- 區間 ---------------- */
function setRange(months){
  curMonths = months;
  var n = CAL.length, from = 0;
  if(months>0){
    var last = new Date(CAL[n-1]+'T00:00:00Z');
    last.setUTCMonth(last.getUTCMonth()-months);
    var tgt = last.toISOString().slice(0,10);
    from = 0;
    for(var i=0;i<n;i++){ if(CAL[i]>=tgt){ from=i; break; } }
  }
  var r = {from:from-0.5, to:n-1+2};
  syncing = true;
  charts.forEach(function(o){ o.chart.timeScale().setVisibleLogicalRange(r); });
  syncing = false;
  [].forEach.call(document.querySelectorAll('#rng button'), function(b){ b.classList.toggle('on', +b.dataset.m===months); });
  scheduleCum();
}

/* ---------------- 頁尾 ---------------- */
function buildSource(){
  var m = D.meta;
  var rows = m.series.map(function(s){
    return '<tr><td>'+s.label+'</td><td>'+s.source+'</td><td class="num">'+(s.first_all||'—')+'</td><td class="num">'+(s.last||'—')+'</td><td class="num">'+s.n.toLocaleString('en-US')+'</td><td class="num">'+s.gaps+'</td></tr>';
  }).join('');
  document.getElementById('src').innerHTML =
    '<h2>資料來源與涵蓋期間</h2><div class="tbl-wrap"><table><thead><tr><th>序列</th><th>來源</th><th>資料最早日</th><th>最新日</th><th>筆數（圖上十年）</th><th>缺漏日</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="fine">資料每個韓國交易日收盤後自動更新，最近一次建檔時間：'+m.updated+'（台北）。'+
    '成交金額、上市總市值、外國人持股、投資人預託金、信用交易融資、借券餘額取自韓國金融投資協會（KOFIA）FreeSIS 統計，原始單位為百萬韓元，頁面換算為億韓元；匯率取自 FRED（聖路易聯邦準備銀行，日資料，約晚一週更新，美國休市日圖上沿用前一營業日）。KOFIA 的日資料通常晚一個交易日公布，最新一天的成交金額、預託金、融資等欄位可能暫時空白。<br>'+
    '指數 K 線與投資人別買賣超取自 Naver 證券（行動版）的公開資料，不是交易所原表。買賣超只有外國人、機構、個人三類，沒有其他法人，所以三者相加不等於零。抽查 5 個交易日與韓國媒體引用的交易所數字比對，4 日誤差在 1.2% 以內，另 1 日（2026-03-27，KOSPI）外國人與個人的金額各差約 4,600 億韓元，原因尚未查明。<br>'+
    '借券餘額是 KOFIA 逐檔公布的全市場合計，含 ETF 與 ETN，與媒體引用的數字約差 0.1%；因為沒有分市場數字，佔比的分母用 KOSPI 加 KOSDAQ 上市總市值。灰色底色是 2023-11-06 至 2025-03-30 的全面禁止放空期間（2025-03-31 恢復）。<br>'+
    '放空餘額與成交、KOSPI200 期貨與選擇權的投資人別部位、VKOSPI，需要韓國交易所（KRX）會員帳號才能取得，暫未提供。<br>'+
    '圖表使用 TradingView Lightweight Charts。</p>';
  document.getElementById('asof').textContent = '指數資料至 '+m.cal_last+'・最近建檔 '+m.updated+'（台北）・所有圖自 '+m.cal_first+' 起';
}

/* ---------------- 主題切換 ---------------- */
function reTheme(){
  var T = theme();
  charts.forEach(function(o){
    o.chart.applyOptions({
      layout:{background:{type:'solid',color:T.bg}, textColor:T.text},
      grid:{vertLines:{color:T.grid}, horzLines:{color:T.grid}},
      leftPriceScale:{borderColor:T.border}, rightPriceScale:{borderColor:T.border}, timeScale:{borderColor:T.border}
    });
    o.series.forEach(function(s){
      var d = s.def;
      if(d.kind==='line') s.api.applyOptions({color:T[d.col]});
      else if(d.kind==='candle') s.api.applyOptions({upColor:T.up,downColor:T.down,borderUpColor:T.up,borderDownColor:T.down,wickUpColor:T.up,wickDownColor:T.down});
      if(d.kind==='hist' || d.kind==='vol') s.api.setData(mkData(d, T));
    });
    if(o.overlay) o.overlay.applyOptions({color:T.idx});
    if(o.cum) o.cum.api.applyOptions({color:T.c4});
    if(o.band) o.band.setData(CAL.map(function(d,i){ return D.cal.ban[i] ? {time:d,value:1,color:T.ban} : {time:d}; }));
  });
  readouts(null);
}

/* ---------------- 啟動 ---------------- */
function load(name){
  return fetch('data/'+name+'.json?v='+V).then(function(r){ if(!r.ok) throw new Error(name+' '+r.status); return r.json(); });
}
function fixNavOffset(){
  var nav = document.querySelector('.imq-nav-root');
  if(nav) document.documentElement.style.setProperty('--nav-h', nav.offsetHeight+'px');
}

Promise.all(FILES.map(load)).then(function(res){
  FILES.forEach(function(f,i){ D[f] = res[i]; });
  CAL = D.cal.t; CAL.forEach(function(d,i){ CAL_IDX[d]=i; });
  fixNavOffset(); window.addEventListener('resize', fixNavOffset);
  buildCards();
  buildSpecs().forEach(buildSection);
  buildSource();
  [].forEach.call(document.querySelectorAll('#rng button'), function(b){
    b.addEventListener('click', function(){ setRange(+b.dataset.m); });
  });
  setRange(12);
  readouts(null);
  if(window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener.bind(mq,'change') : mq.addListener.bind(mq))(reTheme);
  }
  window.__kr = {charts:charts, CAL:CAL, D:D};
  window.__chipsReady = true;
}).catch(function(e){
  document.getElementById('charts').innerHTML = '<div class="err">資料載入失敗：'+String(e.message||e)+'。請稍後重新整理。</div>';
  window.__chipsError = String(e.message||e);
});
})();
</script>
