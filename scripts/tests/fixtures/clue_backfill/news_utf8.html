<h1>甲公司取得乙公司股權　投審會罰款一千萬</h1>
<p>投審會昨（14）日表示，甲公司未經核准即取得乙公司股權，依規定處以新台幣1,000 萬元罰鍰。</p>
<p>投審會指出，甲公司於2025年間透過第三地子公司取得乙公司約 7.5％股權，持股比例已超過申報門檻，
但事前並未送件申請。</p>
<p>甲公司回應，將依法補件，並檢討內部投資申報流程。</p>
<p>另一方面，丁公司本季營收年增３９．５％，毛利率則較上季提高 1.2 個百分點。</p>
