  tier: T2
  category: geo
  level: market
  lang: en
  max_items: 50
  enabled: true
  note: "2026-08-19 直接 curl 從本機網路 DNS 解析被台灣法院命令封鎖名單攔截（域名層級封鎖頁，與內容無關，疑為博弈類網域被境內 ISP 攔截）；改用公開 DNS（8.8.8.8）解析真實 IP 後直接 fetch，回傳 200＋正常 JSON，端點本身正常。GitHub Actions（美國機房）不受此本地封鎖影響，預期正常。fetch.py 對此來源的失敗會誠實記錄在 sources_health.json，不做 DNS 繞過的 hack。"

