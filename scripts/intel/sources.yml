# scripts/intel/sources.yml
# Phase 1（市場層）情報來源清單。對應 notes/site-internal/intel/DESIGN.md §3/§7/§8。
#
# 欄位：
#   id          唯一代碼，snake_case
#   name        人類可讀名稱
#   url         抓取端點（RSS/JSON/CSV）；FRED 用 fredgraph.csv 端點
#   kind        rss | json | csv | html | onsite
#                 rss   -> feedparser 解析
#                 json  -> requests.get().json()（Phase 1 僅做健康檢查，不產卡；見 fetch.py 註解）
#                 csv   -> FRED fredgraph 專用，fetch.py 特判處理
#                 html  -> 純健康檢查用（無結構化解析）
#                 onsite -> 保留給站內 docs/*/data/*.json，Phase 1 未使用（那些路徑寫死在 fetch.py，不走本檔）
#   tier        T1 官方/一手（央行／財政部／統計局／FRED／SEC／TWSE） · T2 主流媒體 · T3 具名專業圈 · T4 匿名/聚合
#   category    rates|credit|liquidity|fx|commodities|vol|breadth|positioning|econ|cb|geo|regime|asia|crypto
#                 （對應 DESIGN.md §3 十三維度 key；on-site 數字卡的維度寫死在 fetch.py，不在此檔）
#   level       market（Phase 1 只做市場層）
#   lang        en | zh | ja
#   max_items   單次抓取上限（RSS/JSON 通用；FRED/單一數值來源設 1）
#   enabled     true/false；false 一律附 note 說明原因
#   note        （選）健康檢查失敗原因，或人工核校備註
#
# 全部 URL 已於 2026-08-19 用真實 HTTP fetch（10s timeout, UA=IntelBot/1.0）核實一次；
# 結果見同日 sources_health.json。停用來源的 note 是當次失敗的實際錯誤，非猜測。

