# scripts/intel/themes.yml — 情報監視器 Phase 2 固定主題註冊表（19 個）。
#
# 用途：
#   1. classify.py 的 haiku 分類 prompt 附上這份清單的 key，逐卡挑一個
#      （或 null）寫進 card.theme。
#   2. render.py 讀本檔做 (a) 舊 payload／haiku 沒填 theme 時的關鍵字 fallback
#      （比對卡片 title ＋ tags.themes，大小寫不分）、(b) 「產業」分頁與「今日頁
#      產業層」分組時的 name_zh／站內錨點來源。
#   3. theme_weekly.py 週更綜述掃過每個有卡片的主題。
#
# 欄位：
#   key          穩定英文 slug——一旦上線不可改名（改名＝砍掉重建
#                theme_history.json／theme_weekly.json 的歷史）。
#   name_zh      頁面顯示用中文名。
#   keywords     中英關鍵字陣列，供 fallback 關鍵字比對；haiku 有填 theme 時
#                不會用到，純粹當保險。
#   id_page      選填，docs/id/ 對應報告檔名（已用 `ls docs/id/` 驗證存在，
#                2026-08-20）。render.py 組出 /id/{id_page} 連結，缺檔案時
#                render 端仍要 fail-safe（此清單只保證寫入當下存在）。
#   kill_theme   選填，對應 docs/detective/data/kill_watch.json 裡
#                items[].theme 的值（已驗證現有 5 個 macro 主題鍵名）。
#   crowding_key 選填，用來對 docs/crowding/data/latest.json 的
#                themes[].name 做 substring 比對（大小寫不分）；不是穩定
#                key，只是查找子字串，找不到就整段省略，不擋頁面。

